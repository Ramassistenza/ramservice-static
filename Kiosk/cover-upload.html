<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carica foto RamCover</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:18px}.card{width:min(520px,100%);background:#fff;color:#07111f;border-radius:28px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.35)}h1{margin:0 0 8px;font-size:34px;line-height:1}p{margin:0 0 18px;color:#526070;line-height:1.5}.file{display:grid;place-items:center;min-height:180px;border:2px dashed #b8c4d3;border-radius:24px;background:#f7fafc;color:#526070;font-weight:800;text-align:center;padding:18px}input{display:none}.preview{display:block;width:100%;max-height:360px;object-fit:contain;border-radius:20px;background:#eef2f7;margin-top:16px}.btn{width:100%;min-height:56px;border:0;border-radius:18px;background:#006ee6;color:#fff;font:inherit;font-weight:900;font-size:17px;margin-top:16px}.btn:disabled{opacity:.45}.status{margin-top:14px;padding:13px;border-radius:16px;background:#eff6ff;color:#07539f;font-weight:800}.ok{background:#e8f8ef;color:#12643d}.err{background:#fff0f0;color:#991b1b}
  </style>
</head>
<body>
  <main class="card">
    <h1>Carica la foto</h1>
    <p>Seleziona dal telefono l'immagine da usare per la cover. Dopo l'invio torna sul monitor kiosk.</p>
    <label class="file">
      <input id="file" type="file" accept="image/*">
      <span>Tocca qui e scegli la foto</span>
    </label>
    <img id="preview" class="preview" hidden alt="Anteprima foto">
    <button id="send" class="btn" disabled>Invia al kiosk</button>
    <div id="status" class="status">In attesa della foto.</div>
  </main>
<script>
(() => {
  const API = "https://ramservice-sync-721276708443.europe-west1.run.app";
  const session = new URLSearchParams(location.search).get("session") || "";
  const file = document.getElementById("file");
  const send = document.getElementById("send");
  const preview = document.getElementById("preview");
  const status = document.getElementById("status");
  let dataUrl = "";
  let selectedFile = null;
  function setStatus(text, cls="status"){ status.textContent=text; status.className=cls; }
  function resizeImage(src){
    return new Promise((resolve,reject)=>{
      const img = new Image();
      img.onload = () => {
        const max = 2200;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg", .9));
      };
      img.onerror = reject;
      img.src = src;
    });
  }
  file.addEventListener("change", () => {
    selectedFile = file.files?.[0] || null;
    if (!selectedFile) return;
    const reader = new FileReader();
    reader.onload = async () => {
      dataUrl = await resizeImage(reader.result);
      preview.src = dataUrl;
      preview.hidden = false;
      send.disabled = false;
      setStatus("Foto pronta. Premi invia al kiosk.");
    };
    reader.readAsDataURL(selectedFile);
  });
  send.addEventListener("click", async () => {
    if (!session || !dataUrl) return setStatus("Sessione non valida. Riscansiona il QR.", "status err");
    send.disabled = true;
    setStatus("Invio foto in corso...");
    try {
      const res = await fetch(`${API}/cover-studio/kiosk/upload-sessions/${encodeURIComponent(session)}/image`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ imageDataUrl: dataUrl, fileName: selectedFile?.name || "foto-cover.jpg", mimeType: "image/jpeg", userAgent: navigator.userAgent })
      });
      const payload = await res.json().catch(()=>({}));
      if (!res.ok || !payload.ok) throw new Error(payload.message || "Errore invio foto");
      setStatus("Foto inviata. Puoi tornare al monitor kiosk.", "status ok");
    } catch (error) {
      send.disabled = false;
      setStatus(error.message, "status err");
    }
  });
})();
</script>
</body>
</html>
