<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Usato Certificato RAMSERVICE</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@600&display=swap" rel="stylesheet">

  <style>
    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body {
      background:#000;
      width:100vw;
      height:100vh;
      overflow:hidden;
      font-family:'Poppins', sans-serif;
    }

    .viewer {
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#000;
    }

    .viewer img {
      max-width:100%;
      max-height:100%;
      object-fit:contain;
    }

    /* HOME BUTTON */
    .home-btn {
      position:fixed;
      bottom:30px;
      right:30px;
      width:110px;
      height:90px;
      border-radius:24px;
      border:none;
      cursor:pointer;
      font-size:2.2em;
      background:#0077cc;
      color:#fff;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
      transition:all 0.25s ease;
      z-index:10;
    }

    .home-btn:hover {
      background:#005fa3;
      transform:scale(1.05);
    }
  </style>
</head>

<body>

  <div class="viewer">
    <img src="https://ramassistenza.github.io/ramservice-static/ramonitor/img/12.jpg"
         alt="Perché scegliere l’usato certificato RAMSERVICE">
  </div>

  <!-- HOME -->
  <button class="home-btn" onclick="window.location.href='index.html'">
    🏠
  </button>

</body>
</html>
