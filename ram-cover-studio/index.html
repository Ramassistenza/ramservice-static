<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAM Cover Studio — Editor</title>
<!-- Tailwind (CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Fabric.js -->
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<style>
html, body { height: 100%; background:#F3F4F7; }
.btn { @apply px-4 py-2 rounded-xl shadow-sm hover:shadow md:transition; }
</style>
</head>
<body class="text-slate-900">
<header class="sticky top-0 z-50 bg-white/80 backdrop-blur border-b">
<div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
<div class="font-semibold text-lg">🎨 RAM Cover Studio</div>
<div class="ml-auto flex items-center gap-3">
<select id="modelSelect" class="border rounded-lg px-3 py-2"></select>
<button id="resetBtn" class="btn bg-white border">Reset</button>
<button id="exportBtn" class="btn bg-black text-white">Esporta PNG</button>
</div>
</div>
</header>


<main class="max-w-6xl mx-auto px-4 py-6 grid md:grid-cols-[320px,1fr] gap-6">
<!-- Toolbar sinistra -->
<aside class="bg-white rounded-2xl p-4 shadow">
<div class="space-y-3">
<label class="block">
<span class="text-sm font-medium">Carica immagine</span>
<input id="uploadImage" type="file" accept="image/*" class="mt-1 w-full" />
</label>
<button id="addTextBtn" class="btn w-full bg-white border">Aggiungi testo</button>
<button id="addEmojiBtn" class="btn w-full bg-white border">Emoji</button>
<label class="block">
<span class="text-sm font-medium">Colore sfondo</span>
<input id="bgColor" type="color" value="#FFFFFF" class="mt-1 w-full h-10" />
</label>
<div class="text-xs text-slate-500">Pinch-to-zoom e drag supportati su touch.</div>
</div>
</aside>


<!-- Canvas e anteprima -->
<section class="bg-white rounded-2xl p-4 shadow">
<div class="flex justify-center">
<canvas id="editorCanvas"></canvas>
</div>
<div id="warnings" class="mt-3 text-amber-600 text-sm"></div>
</section>
</main>


<script type="module" src="/js/editor.js"></script>
</body>
</html>
