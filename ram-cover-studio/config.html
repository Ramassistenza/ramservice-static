<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAM Cover Studio — Config</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
</head>
<body class="bg-slate-50">
<div class="max-w-5xl mx-auto p-6">
<header class="flex items-center gap-3 mb-6">
<h1 class="text-xl font-semibold">🛠️ Configuratore Modelli</h1>
<div class="ml-auto flex gap-2">
<input id="adminEmail" placeholder="email" class="border px-3 py-2 rounded" />
<input id="adminPass" placeholder="password" type="password" class="border px-3 py-2 rounded" />
<button id="loginBtn" class="px-4 py-2 rounded bg-black text-white">Login</button>
</div>
</header>


<section class="grid md:grid-cols-2 gap-6">
<form id="modelForm" class="bg-white rounded-2xl p-4 shadow space-y-3">
<div class="grid grid-cols-2 gap-3">
<label class="text-sm">Nome modello<input name="name" class="border w-full px-3 py-2 rounded" required></label>
<label class="text-sm">ID (slug unico)<input name="id" class="border w-full px-3 py-2 rounded" required></label>
<label class="text-sm">Larghezza (mm)<input type="number" name="width_mm" class="border w-full px-3 py-2 rounded" required></label>
<label class="text-sm">Altezza (mm)<input type="number" name="height_mm" class="border w-full px-3 py-2 rounded" required></label>
<label class="text-sm">DPI<input type="number" name="dpi" class="border w-full px-3 py-2 rounded" value="300" required></label>
<label class="text-sm">Attivo<select name="active" class="border w-full px-3 py-2 rounded"><option value="true">Sì</option><option value="false">No</option></select></label>
<label class="text-sm">Foro X (px)<input type="number" name="hole_x" class="border w-full px-3 py-2 rounded"></label>
<label class="text-sm">Foro Y (px)<input type="number" name="hole_y" class="border w-full px-3 py-2 rounded"></label>
<label class="text-sm">Foro width (px)<input type="number" name="hole_w" class="border w-full px-3 py-2 rounded"></label>
<label class="text-sm">Foro height (px)<input type="number" name="hole_h" class="border w-full px-3 py-2 rounded"></label>
</div>
<label class="text-sm">Maschera PNG<input id="maskFile" type="file" accept="image/png" class="border w-full px-3 py-2 rounded"></label>
<div class="flex gap-2">
<button id="saveModel" class="px-4 py-2 rounded bg-black text-white">Salva/aggiorna</button>
<button id="deleteModel" class="px-4 py-2 rounded bg-red-600 text-white" type="button">Elimina</button>
</div>
</form>


<div class="bg-white rounded-2xl p-4 shadow">
<div class="flex items-center gap-2 mb-3">
</html>
