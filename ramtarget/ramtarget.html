<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RAMSERVICE · Target Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f9fb; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --panel:#ffffff; --card:#ffffff;
  --brand:#0071E3; --ok:#22c55e; --warn:#f59e0b;
  --x1a:#f59e0b; --x1b:#fbbf24; --x2a:#22c55e; --x2b:#86efac; --baseA:#3b82f6; --baseB:#60a5fa;
  --glow:0 8px 24px rgba(0,0,0,.06);
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif}
header,main,footer{max-width:1080px;margin:auto}
header{display:none;position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.wrap{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:26px;height:26px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#7dd3fc)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 10px;border-radius:12px;font-weight:700;cursor:pointer}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 10px;border-radius:12px;cursor:pointer}
.monthname{font-weight:800}
#login{max-width:420px;margin:80px auto;padding:0 18px;text-align:center}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--glow)}
#login input{width:100%;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line)}
#login button{width:100%;padding:12px;border-radius:10px;border:0;background:linear-gradient(90deg,var(--brand),#60a5fa);color:#fff;font-weight:700}
.err{color:#ef4444;font-size:13px;margin-top:8px}
.loader-backdrop{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:90}
.loader{width:56px;height:56px;border-radius:50%;border:5px solid #ddd;border-top-color:var(--brand);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{display:none;padding:16px}
.section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:var(--glow)}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:840px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--glow)}
.card h3{margin:0 0 6px}
.sub{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--muted)}
.barblock{margin-top:10px}
.bartitle{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between}
.bar{height:14px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;overflow:hidden}
.fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--baseA),var(--baseB));animation:fill .9s cubic-bezier(.22,1,.36,1) forwards}
.bar.x1 .fill{background:linear-gradient(90deg,var(--x1a),var(--x1b))}
.bar.x2 .fill{background:linear-gradient(90deg,var(--x2a),var(--x2b))}
@keyframes fill{from{width:0%}to{width:var(--w)}}
.totals{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
@media(min-width:620px){.totals{grid-template-columns:1fr 1fr 1fr}}
.totalbox{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}
.totalbox h4{margin:0 0 4px;font-size:13px;color:var(--muted)}
.totalbox .val{font-weight:900;font-size:18px}
footer{color:var(--muted);text-align:center;padding:22px}

/* Popup Report */
#popup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:100;backdrop-filter:blur(3px)}
.popupBox{width:min(96%,880px);max-height:86vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.2);padding:20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid #e2e8f0;padding:10px;text-align:center}
th{background:#f8fafc}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid #e2e8f0;background:#f1f5f9}
.tag.ok{background:#dcfce7;border-color:#86efac;color:#166534}
</style>
</head>
<body>
<div class="loader-backdrop" id="loader"><div class="loader"></div></div>

<section id="login">
  <h2>RAMSERVICE · Accesso</h2>
  <div class="login-card">
    <input id="luser" placeholder="Username" autocomplete="username">
    <input id="lpass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="lbtn">Accedi</button>
    <div id="lmsg" class="err"></div>
  </div>
</section>

<header id="top">
  <div class="wrap">
    <div class="brand"><div class="dot"></div><h1>Target Premium</h1></div>
    <div class="controls">
      <div class="monthnav">
        <button id="prevM">◀︎</button>
        <span class="monthname" id="mname">OTTOBRE</span>
        <button id="nextM">▶︎</button>
      </div>
      <button class="chip" id="btnReport">📊 Report</button>
      <button class="chip" id="btnReload">Ricarica</button>
      <button class="chip" id="btnLogout">Logout</button>
    </div>
  </div>
</header>

<main id="app"></main>
<footer>© RAMSERVICE — dati aggiornati automaticamente</footer>

<!-- Popup Report -->
<div id="popup">
  <div class="popupBox">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3>📊 Riepilogo premi mensili</h3>
      <button class="chip" onclick="document.getElementById('popup').style.display='none'">Chiudi ✕</button>
    </div>
    <table>
      <thead><tr><th>Mese</th><th>Fatturato</th><th>WindTre</th><th>ho.</th><th>Premi raggiunti</th></tr></thead>
      <tbody id="sumBody"></tbody>
    </table>
  </div>
</div>

<script>
const JSON_URL="https://ramassistenza.github.io/ramservice-static/ramtarget/ramdata.json";
const API_URL="https://script.google.com/macros/s/AKfycbxJwlXUhUYTqT1oOZoMb_F-X0xUhVuxgReXbPFgChNQZWc32B-XJnPCCXPtOCr0NE5L/exec";
const MESI=["GENNAIO","FEBBRAIO","MARZO","APRILE","MAGGIO","GIUGNO","LUGLIO","AGOSTO","SETTEMBRE","OTTOBRE","NOVEMBRE","DICEMBRE"];
const $=s=>document.querySelector(s);
let DATA={},LIVE={},MESE_INDEX=new Date().getMonth();
const euro=v=>Number(v||0).toLocaleString("it-IT",{style:"currency",currency:"EUR",minimumFractionDigits:2});
const pct=(v,t)=>t>0?Math.min(100,(v/t)*100):0;
function showLoader(s=true){$("#loader").style.display=s?"flex":"none";}
function byMonthDict(arr){const out={};(arr||[]).forEach(o=>{const k=o.mese.toUpperCase();out[k]=o});return out;}
function cfgFor(m){const raw=(DATA.config||{})[m];if(!raw)return null;const n=k=>raw[k]||{};return{fatt:n("fatt"),wind:n("wind"),ho:n("ho")};}
function prizesFor(o,v,b){let got=0,left=0;if(b>0&&v>=b)got+=+o.base_prize;else left+=+o.base_prize;if(o.x1_thr>0){if(v>=o.x1_thr)got+=+o.x1_prize;else left+=+o.x1_prize;}if(o.x2_thr>0){if(v>=o.x2_thr)got+=+o.x2_prize;else left+=+o.x2_prize;}return{got,left};}

function makeBar(title,p,value,target,cls,isMoney,hideValues=false){
  const block=document.createElement("div");block.className="barblock "+cls;
  const percent=Math.round(p);
  const labelVal=hideValues?"":(isMoney?`${euro(value)} / ${euro(target)}`:`${value} / ${target}`);
  block.innerHTML=`
    <div class="bartitle">
      <span>${title}</span>
      <span style="font-weight:600;${percent>=100?'color:var(--ok)':''}">${percent}%</span>
    </div>
    <div class="bar ${cls}"><div class="fill" style="--w:${p}%"></div></div>
    ${hideValues?'':`<div class="row"><div>${labelVal}</div><div>${percent>=100?'✅ Completato':''}</div></div>`}`;
  return block;
}

function metricCard({title,value,baseTarget,conf,isMoney,hideValues}){
  const wrap=document.createElement("section");wrap.className="card";
  wrap.innerHTML=`<h3>${title}</h3><div class="sub">${isMoney?'Fatturato (nascosto)':'Numero attivazioni'}</div>`;
  wrap.appendChild(makeBar("Target principale",pct(value,baseTarget),value,baseTarget,"base",isMoney,hideValues));
  if(conf.x1_thr>0)wrap.appendChild(makeBar("Extra soglia 1",pct(value,conf.x1_thr),value,conf.x1_thr,"x1",isMoney,hideValues));
  if(conf.x2_thr>0)wrap.appendChild(makeBar("Extra soglia 2",pct(value,conf.x2_thr),value,conf.x2_thr,"x2",isMoney,hideValues));
  const pv=prizesFor(conf,value,baseTarget);
  const totals=document.createElement("div");totals.className="totals";
  totals.innerHTML=`<div class="totalbox"><h4>Premi raggiunti</h4><div class="val">+ ${euro(pv.got)}</div></div><div class="totalbox"><h4>Ancora raggiungibili</h4><div class="val">${euro(pv.left)}</div></div><div class="totalbox"><h4>Totale potenziale</h4><div class="val">${euro(pv.got+pv.left)}</div></div>`;
  wrap.appendChild(totals);
  return wrap;
}

async function doLogin(){
  $("#lmsg").textContent="";showLoader(true);
  try{
    const conf=await fetch(JSON_URL+"?v="+Date.now());DATA=await conf.json();
    const u=$("#luser").value.trim(),p=$("#lpass").value.trim();
    const ok=(DATA.users||[]).find(x=>x.user===u&&x.pass===p);
    if(!ok){$("#lmsg").textContent="❌ Credenziali errate";return;}
    const liveR=await fetch(API_URL+"?v="+Date.now());LIVE=byMonthDict(await liveR.json());
    $("#login").style.display="none";$("#top").style.display="block";$("#app").style.display="block";
    render();
  }catch(e){$("#lmsg").textContent="Errore: "+e.message;}
  finally{showLoader(false);}
}
$("#lbtn").onclick=doLogin;$("#lpass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});

function render(){
  const m=MESI[MESE_INDEX],app=$("#app");app.innerHTML="";$("#mname").textContent=m;
  const cfg=cfgFor(m),live=LIVE[m];
  if(!cfg||!live){app.innerHTML=`<div class='section'>⚠️ Dati non disponibili per ${m}</div>`;return;}
  const grid=document.createElement("div");grid.className="grid";app.appendChild(grid);
  grid.appendChild(metricCard({title:"Fatturato",value:live.fatt,baseTarget:live.fatt_target,conf:cfg.fatt,isMoney:true,hideValues:true}));
  grid.appendChild(metricCard({title:"WindTre",value:live.wind,baseTarget:live.wind_target,conf:cfg.wind,isMoney:false}));
  grid.appendChild(metricCard({title:"ho. Mobile",value:live.ho,baseTarget:live.ho_target,conf:cfg.ho,isMoney:false}));
  const pf=prizesFor(cfg.fatt,live.fatt,live.fatt_target);
  const pw=prizesFor(cfg.wind,live.wind,live.wind_target);
  const ph=prizesFor(cfg.ho,live.ho,live.ho_target);
  const got=pf.got+pw.got+ph.got,left=pf.left+pw.left+ph.left;
  const total=document.createElement("section");
  total.className="section";
  total.innerHTML=`<h3>💶 Totale complessivo</h3><div class="totals"><div class="totalbox"><h4>Premi raggiunti</h4><div class="val">+ ${euro(got)}</div></div><div class="totalbox"><h4>Ancora raggiungibili</h4><div class="val">${euro(left)}</div></div><div class="totalbox"><h4>Totale potenziale</h4><div class="val">${euro(got+left)}</div></div></div>`;
  app.appendChild(total);
}

$("#btnReload").onclick=async()=>{showLoader(true);const r=await fetch(API_URL+"?v="+Date.now());LIVE=byMonthDict(await r.json());showLoader(false);render();}
$("#btnLogout").onclick=()=>location.reload();
$("#prevM").onclick=()=>{MESE_INDEX=(MESE_INDEX+11)%12;render();};
$("#nextM").onclick=()=>{MESE_INDEX=(MESE_INDEX+1)%12;render();};

/* ====== REPORT ====== */
$("#btnReport").onclick=()=>{
  const tb=$("#sumBody");tb.innerHTML="";
  MESI.forEach(m=>{
    const c=cfgFor(m),l=LIVE[m];
    if(!c||!l)return;
    const pF=pct(l.fatt,l.fatt_target),pW=pct(l.wind,l.wind_target),pH=pct(l.ho,l.ho_target);
    const got=prizesFor(c.fatt,l.fatt,l.fatt_target).got+prizesFor(c.wind,l.wind,l.wind_target).got+prizesFor(c.ho,l.ho,l.ho_target).got;
    tb.innerHTML+=`<tr><td>${m}</td><td><span class="tag ${pF>=100?'ok':''}">${Math.round(pF)}%</span></td><td><span class="tag ${pW>=100?'ok':''}">${Math.round(pW)}%</span></td><td><span class="tag ${pH>=100?'ok':''}">${Math.round(pH)}%</span></td><td>${euro(got)}</td></tr>`;
  });
  $("#popup").style.display="flex";
};
</script>
</body>
</html>
