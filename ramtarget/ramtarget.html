<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RAMSERVICE · Target Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f7; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --card:#fff; --brand:#0071E3; --ok:#22c55e; --warn:#f59e0b;
  --err:#ef4444; --glow:0 6px 18px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Poppins,system-ui,Segoe UI,sans-serif;color:var(--ink)}
.loader-backdrop{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:90}
.loader{width:48px;height:48px;border-radius:50%;border:4px solid #ddd;border-top-color:var(--brand);animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#login{max-width:400px;margin:80px auto;text-align:center}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--glow)}
#login input{width:100%;margin:6px 0;padding:10px;border-radius:8px;border:1px solid var(--line)}
#login button{width:100%;padding:10px;border-radius:8px;border:0;background:linear-gradient(90deg,var(--brand),#60a5fa);color:#fff;font-weight:700}
.err{color:var(--err);font-size:13px;margin-top:6px}
header{display:none;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.05)}
.wrap{max-width:1080px;margin:auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{margin:0;font-size:18px;color:var(--brand)}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav button{border:1px solid var(--line);background:#fff;padding:6px 10px;border-radius:8px;cursor:pointer}
.monthname{font-weight:700}
.chip{border:1px solid var(--line);background:#fff;padding:6px 10px;border-radius:8px;font-weight:600;cursor:pointer}
main{display:none;max-width:1080px;margin:auto;padding:16px}
.section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;box-shadow:var(--glow)}
.grid{display:grid;grid-template-columns:1fr;gap:16px}@media(min-width:840px){.grid{grid-template-columns:1fr 1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--glow)}
.sub{font-size:13px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-top:6px}
.bar{height:12px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;overflow:hidden;margin-top:6px}
.fill{height:100%;width:0%;background:linear-gradient(90deg,var(--brand),#60a5fa);border-radius:999px;animation:fill .8s ease forwards}
.bar.x1 .fill{background:linear-gradient(90deg,var(--warn),#fbbf24)}.bar.x2 .fill{background:linear-gradient(90deg,var(--ok),#86efac)}
@keyframes fill{from{width:0%}to{width:var(--w)}}
.totals{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
@media(min-width:620px){.totals{grid-template-columns:1fr 1fr 1fr}}
.totalbox{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.totalbox h4{margin:0;font-size:12px;color:var(--muted)}
.totalbox .val{font-weight:800;font-size:16px;margin-top:4px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:20px}
</style>
</head>
<body>

<div class="loader-backdrop" id="loader"><div class="loader"></div></div>

<section id="login">
  <h2>RAMSERVICE · Accesso</h2>
  <div class="login-card">
    <input id="luser" placeholder="Username">
    <input id="lpass" type="password" placeholder="Password">
    <button id="lbtn">Accedi</button>
    <div id="lmsg" class="err"></div>
  </div>
</section>

<header id="top">
  <div class="wrap">
    <div class="brand"><h1>Target Premium</h1></div>
    <div class="controls">
      <div class="monthnav">
        <button id="prevM">◀︎</button><span class="monthname" id="mname">OTTOBRE</span><button id="nextM">▶︎</button>
      </div>
      <button class="chip" id="btnSummary">📊 Riepilogo</button>
      <button class="chip" id="btnReload">Ricarica</button>
      <button class="chip" id="btnLogout">Logout</button>
    </div>
  </div>
</header>

<main id="app"></main>
<footer>© RAMSERVICE — dati aggiornati</footer>

<script>
const JSON_URL="https://ramassistenza.github.io/ramservice-static/ramtarget/ramdata.json";
const API_URL="https://script.google.com/macros/s/AKfycbzNTCqnylfnQWO4c8VP2nwrP6L10b_uBv_edPZAL8xRMTMPm9sS_QxcLMN94jY7ZqHq/exec";
const MESI=["GENNAIO","FEBBRAIO","MARZO","APRILE","MAGGIO","GIUGNO","LUGLIO","AGOSTO","SETTEMBRE","OTTOBRE","NOVEMBRE","DICEMBRE"];
const $=s=>document.querySelector(s);
let DATA={},LIVE={},MESE_INDEX=new Date().getMonth();
localStorage.clear();

function parseNum(v) {
  if (v == null || v === "") return 0;

  // Se è già un numero → ritorna direttamente
  if (typeof v === "number") return v;

  // Converti in stringa e rimuovi caratteri non stampabili e spazi Unicode (es. € 26.973,59)
  v = String(v)
        .replace(/\s+/g, "")
        .replace(/\u00A0/g, "")
        .replace(/[€]/g, "")
        .trim();

  // Caso tipico italiano: "26.973,58" oppure "26973,58"
  if (/^\d{1,3}(\.\d{3})*(,\d{2})?$/.test(v)) {
    return parseFloat(v.replace(/\./g, "").replace(",", "."));
  }

  // Caso anglosassone: "26,973.58"
  if (/^\d{1,3}(,\d{3})*(\.\d{2})?$/.test(v)) {
    return parseFloat(v.replace(/,/g, ""));
  }

  // Se è un intero con o senza separatori
  if (/^\d+(\.\d+)?$/.test(v)) {
    return parseFloat(v);
  }

  // Tentativo finale: sostituisce qualsiasi virgola con punto
  v = v.replace(",", ".");
  const num = parseFloat(v);
  return isNaN(num) ? 0 : num;
}


const euro=v=>Number(v||0).toLocaleString("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:2});
const pct=(v,t)=>t>0?Math.min(100,Math.max(0,(v/t)*100)):0;
function showLoader(s=true){$("#loader").style.display=s?"flex":"none";}
function monthName(){return MESI[MESE_INDEX];}
function byMonthDict(arr){
  const out={};
  (arr||[]).forEach(o=>{
    if(!o||!o.mese)return;
    const k=String(o.mese).toUpperCase();
    out[k]={fatt:parseNum(o.fatt),wind:parseNum(o.wind),ho:parseNum(o.ho),
      fatt_target:parseNum(o.fatt_target),wind_target:parseNum(o.wind_target),ho_target:parseNum(o.ho_target)};
  });
  return out;
}
function cfgFor(m){
  const raw=(DATA.config||{})[m];if(!raw)return null;
  const N=k=>{const o=raw[k]||{};return{base_prize:parseNum(o.base_prize),x1_thr:parseNum(o.x1_thr),x1_prize:parseNum(o.x1_prize),x2_thr:parseNum(o.x2_thr),x2_prize:parseNum(o.x2_prize)}};
  return{fatt:N("fatt"),wind:N("wind"),ho:N("ho")};
}
function prizesFor({base_prize,x1_thr,x1_prize,x2_thr,x2_prize},value,baseTarget){
  let got=0,left=0;
  if(baseTarget>0&&value>=baseTarget&&base_prize>0)got+=base_prize;else left+=base_prize;
  if(x1_thr>0){if(value>=x1_thr)got+=x1_prize;else left+=x1_prize;}
  if(x2_thr>0){if(value>=x2_thr)got+=x2_prize;else left+=x2_prize;}
  return{got,left};
}
async function doLogin(){
  $("#lmsg").textContent="";showLoader(true);
  try{
    const conf=await fetch(JSON_URL+"?v="+Date.now());
    if(!conf.ok)throw new Error("Config non raggiungibile");
    DATA=await conf.json();
    const u=$("#luser").value.trim(),p=$("#lpass").value.trim();
    const ok=(DATA.users||[]).find(x=>x.user===u&&x.pass===p);
    if(!ok)throw new Error("Credenziali errate");
    const liveR=await fetch(API_URL+"?v="+Date.now());
    if(!liveR.ok)throw new Error("API non raggiungibile");
    const arr=await liveR.json();LIVE=byMonthDict(arr);
    $("#login").style.display="none";$("#top").style.display="block";$("#app").style.display="block";render();
  }catch(e){$("#lmsg").textContent="Errore: "+e.message;}finally{showLoader(false);}
}
$("#lbtn").onclick=doLogin;$("#lpass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});

function makeBar(p,cls){const d=document.createElement("div");d.className="bar "+cls;d.innerHTML=`<div class="fill" style="--w:${p}%"></div>`;return d;}
function metricCard({title,value,baseTarget,conf,showEuro}){
  const wrap=document.createElement("div");wrap.className="card";
  const sub=`Target: <b>${showEuro?euro(baseTarget):baseTarget}</b> · Risultato: <b>${showEuro?euro(value):value}</b>`;
  wrap.innerHTML=`<h3>${title}</h3><div class="sub">${sub}</div>`;
  const pBase=pct(value,baseTarget);wrap.appendChild(makeBar(pBase,"base"));
  wrap.innerHTML+=`<div class="row"><div></div><div>${Math.round(pBase)}%</div></div>`;
  if(conf.x1_thr>0){const p1=pct(value,conf.x1_thr);wrap.appendChild(makeBar(p1,"x1"));wrap.innerHTML+=`<div class="row"><div>Extra 1 (${conf.x1_thr})</div><div>${Math.round(p1)}%</div></div>`;}
  if(conf.x2_thr>0){const p2=pct(value,conf.x2_thr);wrap.appendChild(makeBar(p2,"x2"));wrap.innerHTML+=`<div class="row"><div>Extra 2 (${conf.x2_thr})</div><div>${Math.round(p2)}%</div></div>`;}
  const pv=prizesFor(conf,value,baseTarget);
  wrap.innerHTML+=`<div class="totals">
    <div class="totalbox"><h4>Raggiunto</h4><div class="val">+ ${euro(pv.got)}</div></div>
    <div class="totalbox"><h4>Ancora possibile</h4><div class="val">${euro(pv.left)}</div></div>
    <div class="totalbox"><h4>Totale</h4><div class="val">${euro(pv.got+pv.left)}</div></div>
  </div>`;
  return {wrap,got:pv.got,left:pv.left};
}
function render(){
  const m=monthName();$("#mname").textContent=m;const app=$("#app");app.innerHTML="";
  const cfg=cfgFor(m),live=LIVE[m];if(!cfg||!live){app.innerHTML=`<div class="section">⚠️ Dati mancanti per ${m}</div>`;return;}
  const grid=document.createElement("div");grid.className="grid";app.appendChild(grid);
  let totGot=0,totLeft=0;
  const fatt=metricCard({title:"Fatturato",value:live.fatt,baseTarget:live.fatt_target,conf:cfg.fatt,showEuro:true});
  const wind=metricCard({title:"WindTre",value:live.wind,baseTarget:live.wind_target,conf:cfg.wind,showEuro:false});
  const ho=metricCard({title:"ho. Mobile",value:live.ho,baseTarget:live.ho_target,conf:cfg.ho,showEuro:false});
  grid.append(fatt.wrap,wind.wrap,ho.wrap);
  totGot=fatt.got+wind.got+ho.got;totLeft=fatt.left+wind.left+ho.left;
  const total=document.createElement("div");total.className="section";
  total.innerHTML=`<h3>💶 Totale complessivo</h3>
    <div class="totals">
      <div class="totalbox"><h4>Raggiunto</h4><div class="val">+ ${euro(totGot)}</div></div>
      <div class="totalbox"><h4>Ancora possibile</h4><div class="val">${euro(totLeft)}</div></div>
      <div class="totalbox"><h4>Totale complessivo</h4><div class="val">${euro(totGot+totLeft)}</div></div>
    </div>`;
  app.appendChild(total);
}
$("#btnReload").onclick=()=>doLogin();
$("#btnLogout").onclick=()=>location.reload();
$("#prevM").onclick=()=>{MESE_INDEX=(MESE_INDEX+11)%12;render();};
$("#nextM").onclick=()=>{MESE_INDEX=(MESE_INDEX+1)%12;render();};
</script>
</body>
</html>
