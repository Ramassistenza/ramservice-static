<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>RAMSERVICE · Target Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f7;
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --panel:#ffffff;
  --card:#ffffff;
  --brand:#0071E3;
  --accent:#9333ea;
  --ok:#22c55e;
  --warn:#f59e0b;
  --err:#ef4444;
  --glow:0 6px 18px rgba(0,0,0,.08);
}
*{box-sizing:border-box} html,body{height:100%}
body{
  margin:0; background:var(--bg);
  color:var(--ink); font-family:Poppins,system-ui,Segoe UI,Roboto,sans-serif;
}

/* LOADER */
.loader-backdrop{position:fixed; inset:0; background:rgba(255,255,255,.6); display:none; align-items:center; justify-content:center; z-index:90; backdrop-filter: blur(2px)}
.loader{width:56px;height:56px;border-radius:50%;border:5px solid #ddd;border-top-color:var(--brand); animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* LOGIN */
#login{max-width:420px; margin:80px auto; padding:0 18px; text-align:center}
#login h2{margin:0 0 12px; color:var(--ink)}
.login-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--glow)}
#login input{width:100%; margin:8px 0; padding:12px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink)}
#login button{width:100%; padding:12px; border-radius:10px; border:0; background:linear-gradient(90deg,var(--brand),#60a5fa); color:#fff; font-weight:700; box-shadow:0 4px 12px rgba(0,113,227,.25)}
.err{color:var(--err); font-size:13px; margin-top:8px}

/* HEADER */
header{display:none; position:sticky; top:0; z-index:30; background:#fff; border-bottom:1px solid var(--line); box-shadow:0 2px 8px rgba(0,0,0,.05)}
.wrap{max-width:1080px; margin:auto; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px}
.brand{display:flex; align-items:center; gap:10px}
.brand .dot{width:26px;height:26px;border-radius:8px; background:linear-gradient(135deg,var(--brand),#7dd3fc)}
.brand h1{font-size:18px; margin:0; color:var(--ink)}
.controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.chip{border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 10px; border-radius:10px; font-weight:700; cursor:pointer}
.monthnav{display:flex; align-items:center; gap:6px}
.monthnav button{border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 10px; border-radius:10px; cursor:pointer}
.monthname{font-weight:800; letter-spacing:.3px}

/* LAYOUT */
main{display:none; max-width:1080px; margin:auto; padding:16px}
.section{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin:14px 0; box-shadow:var(--glow)}
.hrow{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap}
.hrow .meta{font-size:12px; color:var(--muted)}
.grid{display:grid; grid-template-columns:1fr; gap:16px}
@media(min-width:840px){ .grid{grid-template-columns:1fr 1fr} }

.card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--glow)}
.card h3{margin:0 0 6px}
.sub{font-size:12px; color:var(--muted)}
.row{display:flex; align-items:center; justify-content:space-between; margin-top:8px; font-size:13px; color:var(--muted)}
.badge{font-size:11px; padding:4px 10px; border-radius:999px; font-weight:800; background:#f9fafb; border:1px solid var(--line)}
.badge.ok{color:var(--ok); border-color:#16f19533; background:#ecfdf5}
.rew{margin-top:10px; font-size:13px}

/* PROGRESS */
.bar{height:14px; background:#f1f5f9; border:1px solid #e2e8f0; border-radius:999px; overflow:hidden; margin-top:8px}
.fill{height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,var(--brand),#60a5fa); animation:fill .9s cubic-bezier(.22,1,.36,1) forwards}
.bar.x1 .fill{background:linear-gradient(90deg,var(--warn),#fbbf24)}
.bar.x2 .fill{background:linear-gradient(90deg,var(--ok),#86efac)}
@keyframes fill{from{width:0%}to{width:var(--w)}}
.bar.over .fill{filter:saturate(1.2)}

/* TOTALS */
.totals{display:grid; grid-template-columns:1fr; gap:10px; margin-top:10px}
@media(min-width:620px){ .totals{grid-template-columns:1fr 1fr 1fr} }
.totalbox{background:#f9fafb; border:1px solid var(--line); border-radius:12px; padding:12px}
.totalbox h4{margin:0 0 4px; font-size:13px; color:var(--muted)}
.totalbox .val{font-weight:900; font-size:18px}

/* POPUP */
#popup{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:50}
.popupBox{width:min(96%,920px); max-height:86vh; overflow:auto; background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--glow)}
table{width:100%; border-collapse:collapse; font-size:14px}
th,td{border-bottom:1px solid var(--line); padding:10px; text-align:center}
th{color:var(--ink); background:#f1f5f9; position:sticky; top:0}
.tag{font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--ink); background:#f9fafb}
.tag.ok{border-color:#16f19533; color:#16a34a; background:#ecfdf5}

footer{color:var(--muted); text-align:center; padding:22px; font-size:13px}
</style>
</head>
<body>

<!-- LOADER -->
<div class="loader-backdrop" id="loader"><div class="loader" aria-label="Caricamento"></div></div>

<!-- LOGIN -->
<section id="login">
  <h2>RAMSERVICE · Accesso</h2>
  <div class="login-card">
    <input id="luser" placeholder="Username" autocomplete="username">
    <input id="lpass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="lbtn">Accedi</button>
    <div id="lmsg" class="err"></div>
  </div>
</section>

<!-- HEADER -->
<header id="top">
  <div class="wrap">
    <div class="brand"><div class="dot"></div><h1>Target Premium</h1></div>
    <div class="controls">
      <div class="monthnav">
        <button id="prevM" title="Mese precedente">◀︎</button>
        <span class="monthname" id="mname">OTTOBRE</span>
        <button id="nextM" title="Mese successivo">▶︎</button>
      </div>
      <button class="chip" id="btnSummary">📊 Riepilogo</button>
      <button class="chip" id="btnReload" title="Ricarica">Ricarica</button>
      <button class="chip" id="btnLogout">Logout</button>
    </div>
  </div>
</header>

<!-- APP -->
<main id="app"></main>
<footer>© RAMSERVICE — dati aggiornati</footer>

<!-- POPUP -->
<div id="popup">
  <div class="popupBox">
    <div class="hrow" style="margin-bottom:10px">
      <h3>📊 Riepilogo mensile</h3>
      <button class="chip" onclick="document.getElementById('popup').style.display='none'">Chiudi</button>
    </div>
    <table>
      <thead>
        <tr><th>Mese</th><th>Fatturato</th><th>WindTre</th><th>ho. Mobile</th><th>Premi raggiunti</th></tr>
      </thead>
      <tbody id="sumBody"></tbody>
    </table>
  </div>
</div>

<script>
/* ===== CONFIG ===== */
const JSON_URL = "https://ramassistenza.github.io/ramservice-static/ramtarget/ramdata.json";
const API_URL  = "https://script.google.com/macros/s/AKfycbzNTCqnylfnQWO4c8VP2nwrP6L10b_uBv_edPZAL8xRMTMPm9sS_QxcLMN94jY7ZqHq/exec";
const MESI = ["GENNAIO","FEBBRAIO","MARZO","APRILE","MAGGIO","GIUGNO","LUGLIO","AGOSTO","SETTEMBRE","OTTOBRE","NOVEMBRE","DICEMBRE"];
const $ = s => document.querySelector(s);
let DATA={}, LIVE={}, MESE_INDEX = new Date().getMonth();
localStorage.clear();

/* Helpers */
function parseNum(v){ if(typeof v==="string")v=v.replace(/[^\d,.,-]/g,"").replace(",","."); return Number(v)||0; }
const euro = v => Number(v||0).toLocaleString("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:2});
const pct  = (v,t)=> t>0? Math.max(0, Math.min(100, (v/t)*100 )) : 0;
function showLoader(s=true){ $("#loader").style.display = s?"flex":"none"; }
function monthName(){ return MESI[MESE_INDEX]; }

function byMonthDict(arr){
  const out={};
  (arr||[]).forEach(o=>{
    if(!o || !o.mese) return;
    const k=String(o.mese).toUpperCase();
    out[k]={fatt:parseNum(o.fatt),wind:parseNum(o.wind),ho:parseNum(o.ho),
      fatt_target:parseNum(o.fatt_target),wind_target:parseNum(o.wind_target),ho_target:parseNum(o.ho_target)};
  });
  return out;
}
function cfgFor(m){
  const raw=(DATA.config||{})[m];
  if(!raw)return null;
  const N=k=>{const o=raw[k]||{};return{base_prize:parseNum(o.base_prize),x1_thr:parseNum(o.x1_thr),x1_prize:parseNum(o.x1_prize),x2_thr:parseNum(o.x2_thr),x2_prize:parseNum(o.x2_prize)}};
  return{fatt:N("fatt"),wind:N("wind"),ho:N("ho")};
}
function prizesFor({base_prize,x1_thr,x1_prize,x2_thr,x2_prize},value,baseTarget){
  let got=0,left=0;
  if(baseTarget>0&&value>=baseTarget&&base_prize>0){got+=base_prize;}else{left+=base_prize;}
  if(x1_thr>0){if(value>=x1_thr){got+=x1_prize;}else{left+=x1_prize;}}
  if(x2_thr>0){if(value>=x2_thr){got+=x2_prize;}else{left+=x2_prize;}}
  return{got,left};
}

/* Login */
async function doLogin(){
  $("#lmsg").textContent="";
  showLoader(true);
  try{
    const conf=await fetch(JSON_URL+"?v="+Date.now());
    if(!conf.ok)throw new Error("Config non raggiungibile");
    DATA=await conf.json();
    const u=$("#luser").value.trim(),p=$("#lpass").value.trim();
    const ok=(DATA.users||[]).find(x=>x.user===u&&x.pass===p);
    if(!ok)throw new Error("Credenziali errate");

    const liveR=await fetch(API_URL+"?v="+Date.now());
    if(!liveR.ok)throw new Error("API non raggiungibile");
    const arr=await liveR.json();
    LIVE=byMonthDict(arr);

    $("#login").style.display="none";
    $("#top").style.display="block";
    $("#app").style.display="block";
    render();
  }catch(e){ $("#lmsg").textContent="Errore: "+e.message; }
  finally{ showLoader(false); }
}
$("#lbtn").onclick=doLogin;
$("#lpass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});

/* Render */
function makeBar(p,cls){const d=document.createElement("div");d.className="bar "+cls;d.innerHTML=`<div class="fill" style="--w:${p}%"></div>`;return d;}
function metricCard({title,value,baseTarget,conf,showNumbers}){
  const wrap=document.createElement("section");wrap.className="card";
  wrap.innerHTML=`<h3>${title}</h3><div class="sub">${showNumbers?`Target: <b>${baseTarget}</b> · Risultato: <b>${euro(value)}</b>`:"Progresso percentuale"}</div>`;
  const pBase=pct(value,baseTarget);wrap.appendChild(makeBar(pBase,"base"+(pBase>=100?" over":"")));wrap.innerHTML+=`<div class="row"><div></div><div><span class="badge">${Math.round(pBase)}%</span></div></div>`;
  if(conf.x1_thr>0){const p1=pct(value,conf.x1_thr);wrap.appendChild(makeBar(p1,"x1"));wrap.innerHTML+=`<div class="row"><div>Extra 1 (${conf.x1_thr})</div><div>${Math.round(p1)}%</div></div>`;}
  if(conf.x2_thr>0){const p2=pct(value,conf.x2_thr);wrap.appendChild(makeBar(p2,"x2"));wrap.innerHTML+=`<div class="row"><div>Extra 2 (${conf.x2_thr})</div><div>${Math.round(p2)}%</div></div>`;}
  const pv=prizesFor(conf,value,baseTarget);wrap.innerHTML+=`<div class="totals"><div class="totalbox"><h4>Raggiunto</h4><div class="val">+ ${euro(pv.got)}</div></div><div class="totalbox"><h4>Ancora possibile</h4><div class="val">${euro(pv.left)}</div></div><div class="totalbox"><h4>Totale</h4><div class="val">${euro(pv.got+pv.left)}</div></div></div>`;return wrap;
}
function render(){
  const m=monthName();$("#mname").textContent=m;
  const app=$("#app");app.innerHTML="";
  const cfg=cfgFor(m),live=LIVE[m];
  if(!cfg||!live){app.innerHTML=`<section class="section">⚠️ Dati mancanti per ${m}</section>`;return;}
  const grid=document.createElement("div");grid.className="grid";app.appendChild(grid);
  grid.appendChild(metricCard({title:"Fatturato",value:live.fatt,baseTarget:live.fatt_target,conf:cfg.fatt,showNumbers:true}));
  grid.appendChild(metricCard({title:"WindTre",value:live.wind,baseTarget:live.wind_target,conf:cfg.wind,showNumbers:true}));
  grid.appendChild(metricCard({title:"ho. Mobile",value:live.ho,baseTarget:live.ho_target,conf:cfg.ho,showNumbers:true}));
}

/* Controls */
$("#btnReload").onclick=()=>doLogin();
$("#btnLogout").onclick=()=>location.reload();
$("#prevM").onclick=()=>{MESE_INDEX=(MESE_INDEX+11)%12;render();};
$("#nextM").onclick=()=>{MESE_INDEX=(MESE_INDEX+1)%12;render();};
$("#btnSummary").onclick=()=>{
  const tb=$("#sumBody");tb.innerHTML="";
  MESI.forEach(m=>{
    const c=cfgFor(m),l=LIVE[m];
    if(!c||!l)return;
    const pF=pct(l.fatt,l.fatt_target),pW=pct(l.wind,l.wind_target),pH=pct(l.ho,l.ho_target);
    const got=prizesFor(c.fatt,l.fatt,l.fatt_target).got+prizesFor(c.wind,l.wind,l.wind_target).got+prizesFor(c.ho,l.ho,l.ho_target).got;
    tb.innerHTML+=`<tr><td>${m}</td><td><span class="tag ${pF>=100?'ok':''}">${Math.round(pF)}%</span></td><td><span class="tag ${pW>=100?'ok':''}">${Math.round(pW)}%</span></td><td><span class="tag ${pH>=100?'ok':''}">${Math.round(pH)}%</span></td><td>${euro(got)}</td></tr>`;
  });
  $("#popup").style.display="flex";
};
</script>
</body>
</html>
