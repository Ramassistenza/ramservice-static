<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMSERVICE · Target</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ram-blue:#0071E3;--ink:#111;--page:#F5F5F7;--card:#fff;--ok:#16a34a;--x1:#f59e0b;--x2:#10b981;
}
body{margin:0;background:var(--page);font-family:Poppins,sans-serif;color:var(--ink)}
#loginScreen{text-align:center;padding:60px 20px}
#loginScreen input{padding:10px;width:90%;max-width:280px;border-radius:8px;border:1px solid #ccc;margin:6px 0}
#loginScreen button{background:var(--ram-blue);color:#fff;border:0;padding:10px 24px;border-radius:8px;margin-top:10px;cursor:pointer}
header{display:none;position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;z-index:10}
.wrap{max-width:820px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px}
.logo div{width:30px;height:30px;border-radius:8px;background:var(--ram-blue)}
.logo h1{font-size:18px;margin:0}
.logout{background:#eee;border:0;padding:6px 12px;border-radius:8px;cursor:pointer}
main{display:none;max-width:820px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 10px rgba(0,0,0,.07)}
.bar{height:14px;background:#eceff3;border-radius:999px;overflow:hidden;margin-top:6px}
.bar>.fill{height:100%;width:0%;transition:width .8s ease;background:linear-gradient(90deg,var(--ram-blue),#33b1ff)}
.bar.x1>.fill{background:linear-gradient(90deg,var(--x1),#fbbf24)}
.bar.x2>.fill{background:linear-gradient(90deg,var(--x2),#6ee7b7)}
.rewards{margin-top:6px;font-size:13px}
.percent-row{display:flex;justify-content:space-between;margin-top:4px;font-size:13px}
.badge-ok{font-size:11px;color:#fff;background:var(--ok);padding:3px 8px;border-radius:999px}
footer{text-align:center;padding:20px;font-size:12px;color:#777}
#errorBox{color:#d00;text-align:center;margin-top:20px;white-space:pre-wrap;}
</style>
</head>
<body>

<div id="loginScreen">
  <h2 style="color:#0071E3;">RAMSERVICE · Accesso</h2>
  <input id="loginUser" placeholder="Username"><br>
  <input id="loginPass" placeholder="Password" type="password"><br>
  <button id="loginBtn">Accedi</button>
  <div id="loginMsg" style="color:#d00;margin-top:10px;font-size:13px;"></div>
  <div id="errorBox"></div>
</div>

<header id="header">
  <div class="wrap">
    <div class="logo"><div></div><h1>RAMSERVICE · Target</h1></div>
    <button class="logout" id="logoutBtn">Logout</button>
  </div>
</header>

<main id="app"></main>
<footer id="footer">© RAMSERVICE — dati aggiornati</footer>

<script>
const JSON_URL="https://ramassistenza.github.io/ramservice-static/ramtarget/ramdata.json";
const MESI=["GENNAIO","FEBBRAIO","MARZO","APRILE","MAGGIO","GIUGNO","LUGLIO","AGOSTO","SETTEMBRE","OTTOBRE","NOVEMBRE","DICEMBRE"];
function meseCorrente(){return MESI[new Date().getMonth()];}
function euro(v){return v.toLocaleString("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0});}
function pct(a,b){return b>0?(a/b)*100:0;}
function bar(p,cls){const el=document.createElement("div");el.className="bar "+(cls||"");el.innerHTML=`<div class="fill" style="width:${Math.min(100,p)}%"></div>`;return el;}
function rowPercent(p,ok){return `<div class="percent-row"><div>${Math.round(p)}%</div>${ok?"<div class='badge-ok'>Completato</div>":""}</div>`;}

let DATA={};

document.getElementById("loginBtn").onclick=login;
document.getElementById("logoutBtn").onclick=()=>{localStorage.removeItem("ram_user");location.reload();};

(async ()=>{
  // mostra subito login se non loggato
  if(!localStorage.getItem("ram_user")){
    document.getElementById("loginScreen").style.display="block";
  } else {
    await loadData();
    showApp();
  }
})();

async function loadData(){
  try{
    const res=await fetch(JSON_URL+"?v="+Date.now());
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const txt=await res.text();
    try{
      DATA=JSON.parse(txt);
    }catch(e){
      document.getElementById("errorBox").textContent="Errore: il file JSON non è valido.\n\nRisposta ricevuta:\n"+txt.slice(0,200);
      throw e;
    }
  }catch(e){
    document.getElementById("errorBox").textContent="Errore nel caricamento del file JSON: "+e.message;
  }
}

async function login(){
  await loadData();
  if(!DATA.users){document.getElementById("loginMsg").textContent="❌ Nessun utente trovato nel JSON";return;}
  const u=document.getElementById("loginUser").value.trim().toLowerCase();
  const p=document.getElementById("loginPass").value.trim();
  const found=(DATA.users||[]).find(x=>x.user.toLowerCase()===u && x.pass===p);
  if(found){
    localStorage.setItem("ram_user",found.user);
    showApp();
  } else {
    document.getElementById("loginMsg").textContent="❌ Credenziali errate";
  }
}

function showApp(){
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("header").style.display="";
  document.getElementById("app").style.display="";
  render();
}

function render(){
  const mese=meseCorrente();
  const app=document.getElementById("app");
  app.innerHTML=`<h2 style='margin:10px 0;'>📅 Target e Premi — ${mese}</h2>`;
  const cfg=(DATA.config||{})[mese];
  if(!cfg){
    app.innerHTML+="<div class='card'>⚠️ Nessuna configurazione trovata per questo mese.</div>";
    return;
  }
