<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMSERVICE · Target (Debug)</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Poppins,sans-serif;background:#f5f5f7;color:#111;text-align:center}
.card{max-width:600px;margin:20px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.1);text-align:left}
button{background:#0071E3;color:#fff;border:0;border-radius:8px;padding:10px 24px;cursor:pointer}
input{padding:10px;width:80%;margin:6px 0;border-radius:8px;border:1px solid #ccc}
.bar{height:14px;background:#e4e7eb;border-radius:999px;overflow:hidden;margin-top:6px}
.bar>.fill{height:100%;width:0;transition:width .8s ease;background:linear-gradient(90deg,#0071E3,#33b1ff)}
.bar.x1>.fill{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bar.x2>.fill{background:linear-gradient(90deg,#10b981,#6ee7b7)}
#msg{color:#d00;margin-top:10px;font-size:13px}
.debug{color:#0071E3;margin-top:10px;font-size:13px}
</style>
</head>
<body>

<div id="loginScreen">
  <h2>RAMSERVICE · Accesso</h2>
  <input id="user" placeholder="Username"><br>
  <input id="pass" type="password" placeholder="Password"><br>
  <button id="loginBtn">Accedi</button>
  <div id="msg"></div>
</div>

<div id="main" style="display:none;">
  <h2 id="title"></h2>
  <div id="content"></div>
</div>

<script>
const JSON_URL = "https://ramassistenza.github.io/ramservice-static/ramtarget/ramdata.json";
const MESI = ["GENNAIO","FEBBRAIO","MARZO","APRILE","MAGGIO","GIUGNO","LUGLIO","AGOSTO","SETTEMBRE","OTTOBRE","NOVEMBRE","DICEMBRE"];
function meseCorrente(){return MESI[new Date().getMonth()];}
let DATA={};

document.getElementById("loginBtn").onclick = async ()=>{
  document.getElementById("msg").textContent="Connessione in corso...";
  try{
    const res=await fetch(JSON_URL+"?v="+Date.now());
    const txt=await res.text();
    DATA=JSON.parse(txt);
    console.log("JSON",DATA);
    document.getElementById("msg").innerHTML="<span class='debug'>✅ JSON caricato</span>";
    const u=document.getElementById("user").value.trim().toLowerCase();
    const p=document.getElementById("pass").value.trim();
    const found=(DATA.users||[]).find(x=>x.user.toLowerCase()===u && x.pass===p);
    if(!found){document.getElementById("msg").textContent="❌ Credenziali errate";return;}
    document.getElementById("msg").innerHTML="<span class='debug'>✅ Login riuscito</span>";
    showDashboard();
  }catch(e){
    document.getElementById("msg").textContent="Errore JSON: "+e.message;
  }
};

function showDashboard(){
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("main").style.display="block";
  const mese=meseCorrente();
  document.getElementById("title").textContent="📅 Target — "+mese;
  const cfg=(DATA.config||{})[mese];
  const c=document.getElementById("content");
  if(!cfg){c.innerHTML="<div class='card'>⚠️ Nessuna configurazione per "+mese+"</div>";return;}
  c.innerHTML="<div class='debug'>✅ Configurazione trovata per "+mese+"</div>";
  addMetric("Fatturato",cfg.fatt,false);
  addMetric("WindTre",cfg.wind,true);
  addMetric("ho. Mobile",cfg.ho,true);
}

function addMetric(label,d,showNumbers){
  const c=document.getElementById("content");
  if(!d)return;
  const div=document.createElement("div");
  div.className="card";
  div.innerHTML=`<h3>${label}</h3>`;
  div.innerHTML+=`<div>Base: ${d.base}</div>`;
  div.innerHTML+=`<div>Soglia 1: ${d.x1_thr} (Premio: €${d.x1_prize})</div>`;
  div.innerHTML+=`<div>Soglia 2: ${d.x2_thr} (Premio: €${d.x2_prize})</div>`;
  div.innerHTML+=`<div class='bar'><div class='fill' style='width:${(d.base/d.x1_thr*100)}%'></div></div>`;
  c.appendChild(div);
}
</script>

</body>
</html>
