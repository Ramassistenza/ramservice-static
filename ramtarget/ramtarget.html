<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RAMSERVICE · Target</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f5f7; --card:#fff; --ink:#0f172a; --muted:#64748b;
  --blue:#0071E3; --green:#10b981; --amber:#f59e0b; --gray:#e5e7eb;
}
body { margin:0; font-family:Poppins,sans-serif; background:var(--bg); color:var(--ink);}
h1,h2,h3 {margin:0;}
button {cursor:pointer;font-family:inherit;}
#login {max-width:400px;margin:80px auto;padding:20px;text-align:center;}
#login h2 {color:var(--blue);}
#login input {width:100%;margin:6px 0;padding:10px;border-radius:10px;border:1px solid var(--gray);}
#login button {background:var(--blue);color:#fff;border:0;padding:10px 16px;border-radius:10px;width:100%;font-weight:600;}
.err {color:#b91c1c;font-size:13px;margin-top:6px;}

header {background:var(--card);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--gray);}
header h2 {font-size:18px;color:var(--blue);}
main {max-width:900px;margin:auto;padding:16px;}
.card {background:var(--card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 4px 10px rgba(0,0,0,.04);}
.bar {height:12px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin-top:6px;}
.bar .fill {height:100%;width:0%;transition:width .8s ease;border-radius:10px;}
.bar.base .fill {background:var(--blue);}
.bar.x1 .fill {background:var(--amber);}
.bar.x2 .fill {background:var(--green);}
.row {display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:4px;}
.rew {font-size:13px;margin-top:6px;color:var(--green);}
nav {display:flex;align-items:center;gap:10px;}
nav button {border:0;background:var(--blue);color:#fff;padding:6px 10px;border-radius:8px;}
nav span {font-weight:600;color:var(--ink);}
.actions button {background:#e2e8f0;color:#111;border:0;padding:6px 10px;border-radius:8px;}
footer {text-align:center;font-size:12px;color:var(--muted);padding:20px;}
#popup {position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;}
#popup .box {background:var(--card);padding:20px;border-radius:16px;max-width:500px;width:90%;max-height:80%;overflow:auto;}
#popup table {width:100%;border-collapse:collapse;font-size:14px;}
#popup th,#popup td {border-bottom:1px solid var(--gray);padding:6px;text-align:center;}
#popup th {background:var(--bg);}
</style>
</head>
<body>

<section id="login">
  <h2>RAMSERVICE · Accesso</h2>
  <input id="user" placeholder="Utente">
  <input id="pass" type="password" placeholder="Password">
  <button id="btnLogin">Accedi</button>
  <div id="lmsg" class="err"></div>
</section>

<header id="top" style="display:none;">
  <nav>
    <button id="prevM">◀️</button>
    <span id="monthTitle"></span>
    <button id="nextM">▶️</button>
  </nav>
  <div class="actions">
    <button id="summaryBtn">📊 Riepilogo</button>
    <button id="logout">Logout</button>
  </div>
</header>

<main id="app" style="display:none;"></main>
<footer>© RAMSERVICE — dati aggiornati</footer>

<div id="popup">
  <div class="box">
    <h3>📊 Riepilogo mensile</h3>
    <table id="summaryTable">
      <thead><tr><th>Mese</th><th>Fatturato</th><th>WindTre</th><th>ho. Mobile</th></tr></thead>
      <tbody></tbody>
    </table>
    <button style="margin-top:10px;" onclick="document.getElementById('popup').style.display='none'">Chiudi</button>
  </div>
</div>

<script>
const JSON_URL = "https://ramassistenza.github.io/ramservice-static/ramtarget/ramdata.json";
const API_URL  = "https://script.google.com/macros/s/AKfycbwUo3JXn-SU4bTYW3ukt6RVezAUz73HhJMXd94-n2spIqv8RBdO8qVB-QZrJMdJrZT4/exec";
const MESI = ["GENNAIO","FEBBRAIO","MARZO","APRILE","MAGGIO","GIUGNO","LUGLIO","AGOSTO","SETTEMBRE","OTTOBRE","NOVEMBRE","DICEMBRE"];
let DATA={}, LIVE={}, currentMese = new Date().getMonth();
const $ = s=>document.querySelector(s);
localStorage.clear(); // login sempre pulito

$("#btnLogin").onclick = async ()=>{
  const u=$("#user").value.trim(), p=$("#pass").value.trim();
  $("#lmsg").textContent="";
  try{
    const j = await (await fetch(JSON_URL)).json();
    DATA=j;
    const ok=j.users.find(x=>x.user===u && x.pass===p);
    if(!ok){ $("#lmsg").textContent="Credenziali errate"; return; }
    $("#login").style.display="none";
    $("#top").style.display="";
    $("#app").style.display="";
    await loadLive();
    render();
  }catch(e){ $("#lmsg").textContent="Errore: "+e.message; }
};

async function loadLive(){
  try{
    const r=await fetch(API_URL+"?v="+Date.now());
    const js=await r.json();
    LIVE[js.mese.toUpperCase()]=js;
  }catch(e){
    console.warn("Errore caricamento dati live:",e);
  }
}

function normCfg(m){
  const raw=DATA.config[m];
  if(!raw)return null;
  const n=k=>({ main_thr:Number(raw[k].main_thr||0), base_prize:Number(raw[k].base_prize||raw[k].base||0),
    x1_thr:Number(raw[k].x1_thr||0), x1_prize:Number(raw[k].x1_prize||0),
    x2_thr:Number(raw[k].x2_thr||0), x2_prize:Number(raw[k].x2_prize||0)});
  return { fatt:n("fatt"), wind:n("wind"), ho:n("ho") };
}

function euro(v){return "€"+Number(v||0).toLocaleString("it-IT");}
function pct(v,t){return t>0?Math.min(100,(v/t)*100):0;}

function barHTML(p,cls){return `<div class="bar ${cls}"><div class="fill" style="width:${p}%"></div></div>`;}

function render(){
  const mese=MESI[currentMese];
  $("#monthTitle").textContent=mese;
  const cfg=normCfg(mese); const live=LIVE[mese]||{fatt:0,wind:0,ho:0};
  const app=$("#app"); app.innerHTML="";
  if(!cfg){app.innerHTML=`<div class='card'>Nessuna configurazione per ${mese}</div>`;return;}
  
  const fattP=pct(live.fatt,cfg.fatt.main_thr);
  app.innerHTML+=`
  <div class='card'><h3>Fatturato</h3>
  <div class='row'><div>Base: ${euro(cfg.fatt.base_prize)}</div><div>${Math.round(fattP)}%</div></div>
  ${barHTML(fattP,"base")}
  ${fattP>=100?`<div class='rew'>🏆 Premio base ${euro(cfg.fatt.base_prize)}</div>`:""}
  </div>`;

  ["wind","ho"].forEach(k=>{
    const val=live[k], c=cfg[k], p1=pct(val,c.x1_thr), p2=pct(val,c.x2_thr);
    app.innerHTML+=`
    <div class='card'><h3>${k==="wind"?"WindTre":"ho. Mobile"}</h3>
    <div class='row'><div>${val}/${c.main_thr}</div></div>
    ${barHTML(p1,"x1")}
    ${p1>=100?`<div class='rew'>🎉 Extra 1: ${euro(c.x1_prize)}</div>`:""}
    ${barHTML(p2,"x2")}
    ${p2>=100?`<div class='rew'>🏆 Extra 2: ${euro(c.x2_prize)}</div>`:""}
    </div>`;
  });
}

$("#prevM").onclick=()=>{currentMese=(currentMese+11)%12;render();};
$("#nextM").onclick=()=>{currentMese=(currentMese+1)%12;render();};
$("#logout").onclick=()=>location.reload();
$("#summaryBtn").onclick=()=>{
  const tb=$("#summaryTable tbody"); tb.innerHTML="";
  MESI.forEach(m=>{
    const l=LIVE[m]||{}, c=normCfg(m)||{fatt:{},wind:{},ho:{}};
    if(!c.fatt.main_thr)return;
    tb.innerHTML+=`<tr><td>${m}</td><td>${euro(l.fatt||0)}</td><td>${l.wind||0}</td><td>${l.ho||0}</td></tr>`;
  });
  $("#popup").style.display="flex";
};
</script>
</body>
</html>
