<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMSERVICE Configuratore Grafico</title>
<style>
body{font-family:Poppins,sans-serif;background:#f5f5f5;margin:0;padding:20px;color:#111}
h1{color:#0071E3}
fieldset{border:1px solid #ddd;border-radius:8px;margin:10px 0;padding:10px;background:#fff}
legend{font-weight:600;color:#0071E3}
label{display:block;margin-top:6px}
input{padding:6px;width:100%;border-radius:6px;border:1px solid #ccc;margin-top:2px}
button{background:#0071E3;color:#fff;border:0;padding:8px 16px;border-radius:8px;margin-top:10px;cursor:pointer}
hr{margin:20px 0;border:none;border-top:1px solid #ccc}
textarea{width:100%;height:300px;margin-top:10px;border-radius:6px;padding:8px;font-family:monospace}
</style>
</head>
<body>

<h1>⚙️ RAMSERVICE · Configuratore</h1>

<!-- UTENTI -->
<fieldset>
<legend>👤 Aggiungi Utente</legend>
<label>Nome completo</label><input id="uName" placeholder="Emanuele">
<label>Username</label><input id="uUser" placeholder="emanuele">
<label>Password</label><input id="uPass" placeholder="abcd">
<button onclick="addUser()">➕ Aggiungi utente</button>
<div id="userList"></div>
</fieldset>

<!-- CONFIGURAZIONE -->
<fieldset>
<legend>📅 Configurazione Mensile</legend>
<label>Mese (es. OTTOBRE)</label><input id="cMonth" placeholder="OTTOBRE">
<h4>📊 Fatturato</h4>
<label>Base</label><input id="fBase" type="number" value="200">
<label>Extra1 soglia</label><input id="fX1T" type="number" value="28000">
<label>Extra1 premio</label><input id="fX1P" type="number" value="50">
<label>Extra2 soglia</label><input id="fX2T" type="number" value="30000">
<label>Extra2 premio</label><input id="fX2P" type="number" value="100">
<h4>💨 WindTre</h4>
<label>Base</label><input id="wBase" type="number" value="50">
<label>Extra1 soglia</label><input id="wX1T" type="number" value="20">
<label>Extra1 premio</label><input id="wX1P" type="number" value="20">
<label>Extra2 soglia</label><input id="wX2T" type="number" value="25">
<label>Extra2 premio</label><input id="wX2P" type="number" value="50">
<h4>📱 ho. Mobile</h4>
<label>Base</label><input id="hBase" type="number" value="50">
<label>Extra1 soglia</label><input id="hX1T" type="number" value="20">
<label>Extra1 premio</label><input id="hX1P" type="number" value="20">
<label>Extra2 soglia</label><input id="hX2T" type="number" value="25">
<label>Extra2 premio</label><input id="hX2P" type="number" value="50">
<button onclick="addConfig()">➕ Aggiungi Configurazione</button>
<div id="configList"></div>
</fieldset>

<hr>

<button onclick="generate()">📄 Genera JSON Finale</button>
<textarea id="output"></textarea>

<script>
let data={users:[],config:{}};

function addUser(){
  const name=uName.value.trim(),user=uUser.value.trim(),pass=uPass.value.trim();
  if(!name||!user||!pass)return alert("Compila tutti i campi utente");
  data.users.push({name,user,pass});
  renderUsers();
  uName.value=uUser.value=uPass.value="";
}

function renderUsers(){
  userList.innerHTML=data.users.map(u=>`👤 ${u.name} (${u.user})`).join("<br>");
}

function addConfig(){
  const m=cMonth.value.trim().toUpperCase();
  if(!m)return alert("Inserisci il mese");
  data.config[m]={
    fatt:{base:+fBase.value,x1_thr:+fX1T.value,x1_prize:+fX1P.value,x2_thr:+fX2T.value,x2_prize:+fX2P.value},
    wind:{base:+wBase.value,x1_thr:+wX1T.value,x1_prize:+wX1P.value,x2_thr:+wX2T.value,x2_prize:+wX2P.value},
    ho:{base:+hBase.value,x1_thr:+hX1T.value,x1_prize:+hX1P.value,x2_thr:+hX2T.value,x2_prize:+hX2P.value}
  };
  renderConfig();
  cMonth.value="";
}

function renderConfig(){
  configList.innerHTML=Object.keys(data.config).map(k=>`📅 ${k}`).join("<br>");
}

function generate(){
  const json=JSON.stringify(data,null,2);
  output.value=json;
  alert("✅ JSON generato! Copialo e incollalo nel file ramdata.json del tuo repo GitHub.");
}
</script>

</body>
</html>
