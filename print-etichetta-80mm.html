<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stampa Etichetta 80mm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/qz-tray/qz-tray.js"></script>
  <style>
    body { font-family: monospace; background:#111; color:#0f0; padding:12px; }
    .ok { color:#0f0; }
    .err { color:#f55; }
    .warn { color:#ff0; }
    pre { white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <pre id="log"></pre>

<script>
const logEl = document.getElementById("log");
const log = (msg, cls="") => {
  logEl.innerHTML += (cls ? `<span class="${cls}">` : "") + msg + (cls ? `</span>` : "") + "\n";
  console.log(msg);
};

function getParam(name) {
  return new URL(window.location.href).searchParams.get(name);
}

function looksLikePlaceholder(v){
  return /^\s*\$\{.*\}\s*$/.test(String(v || ""));
}

function onlyDigits(v){
  return String(v || "").replace(/\D+/g, "");
}

// ✅ METTI QUI IL TUO CLOUD RUN (base url)
const BACKEND_BASE = "https://ramservice-signature-721276708443.europe-west1.run.app";

// Nome stampante QZ
const PRINTER_NAME = "Aclas Printer";

async function fetchLabelData() {
  const type = (getParam("type") || "accettazione").toLowerCase();

  // prendo parametri
  const idRaw = getParam("id");
  const numeroRaw = getParam("numero");

  // se Ragic lascia ${...} non li considero validi
  const id = (!idRaw || looksLikePlaceholder(idRaw)) ? "" : onlyDigits(idRaw);
  const numero = (!numeroRaw || looksLikePlaceholder(numeroRaw)) ? "" : onlyDigits(numeroRaw);

  log("PAGE URL: " + window.location.href, "warn");
  log(`PARAMS id=${idRaw} → ${id || "-"} | numero=${numeroRaw} → ${numero || "-"} | type=${type}`);

  // 🔒 REGOLA SAFE:
  // - se hai id OK puoi stampare
  // - se id non c'è / non è valido, allora DEVI passare numero
  if (!id && !numero) {
    throw new Error("Parametro mancante: serve ?id=... oppure ?numero=... (Ragic non ha sostituito i placeholder)");
  }

  const qs = new URLSearchParams();
  if (id) qs.set("id", id);
  if (numero) qs.set("numero", numero);
  qs.set("type", type);
  qs.set("_", Date.now()); // cache-bust

  const url = `${BACKEND_BASE}/api/label?${qs.toString()}`;
  log("GET " + url);

  const res = await fetch(url, { method: "GET", cache: "no-store" });
  const txt = await res.text();

  if (!res.ok) {
    throw new Error(`Backend ${res.status}: ${txt}`);
  }

  const json = JSON.parse(txt);
  return json;
}

function escposText(label) {
  const nl  = "\n";
  const cut = "\x1D\x56\x41"; // partial cut

  // ===== ESC/POS commands =====
  const INIT         = "\x1B\x40";
  const ALIGN_LEFT   = "\x1B\x61\x00";
  const ALIGN_CENTER = "\x1B\x61\x01";
  const BOLD_ON      = "\x1B\x45\x01";
  const BOLD_OFF     = "\x1B\x45\x00";

  // Font: A è più leggibile in grande
  const FONT_A       = "\x1B\x4D\x00";

  // Size (GS ! n)
  const SIZE_1X1     = "\x1D\x21\x00";
  const SIZE_2X1     = "\x1D\x21\x10"; // alto (più leggibile)
  const SIZE_2X2     = "\x1D\x21\x11"; // molto grande

  // Line spacing un po' più “aria” (ESC 3 n)
  const LINE_SP_24   = "\x1B\x33\x18"; // 24
  const LINE_SP_DEF  = "\x1B\x32";     // default

  // qualità (best effort, se ignorati non fanno danni)
  const SLOW_PRINT   = "\x1F\x11\x02";
  const DENSITY_HIGH = "\x1D\x7C\x0A";
  const HEAT_STRONG  = "\x1D\x28\x45\x04\x00\x02\x08\x02\x02";

  // ===== helpers =====
  const clean = (s) =>
    String(s || "")
      .replace(/\r/g, "")
      .replace(/[ \t]+/g, " ")
      .trim();

  // wrap per 80mm con font grande (meno colonne)
  const wrap = (text, width = 28) => {
    const t = clean(text);
    if (!t) return [];
    const words = t.split(" ");
    const out = [];
    let line = "";
    for (const w of words) {
      if (!line) line = w;
      else if ((line + " " + w).length <= width) line += " " + w;
      else { out.push(line); line = w; }
    }
    if (line) out.push(line);
    return out;
  };

  const hr = "------------------------------" + nl;

  // ===== fields =====
  const numeroScheda = clean(label.numeroScheda) || "-";
  const type         = (clean(label.type) || "ACCETTAZIONE").toUpperCase();
  const dataIngresso = clean(label.dataIngresso);
  const cliente      = clean(label.cliente) || "-";
  const telefono     = clean(label.telefono);
  const dispositivo  = clean(label.dispositivo) || "-";
  const seriale      = clean(label.seriale);
  const difetto      = clean(label.difetto);
  const costoRaw     = clean(label.costo);

  // normalizza costo (evita robe strane tipo "0" isolato)
  const costo = costoRaw ? costoRaw.replace(/\s+/g, " ").trim() : "-";

  const out = [];

  // ===== INIT + qualità =====
  out.push(INIT, FONT_A, SLOW_PRINT, DENSITY_HIGH, HEAT_STRONG, LINE_SP_24);

  // ===== HEADER grande =====
  out.push(ALIGN_CENTER, BOLD_ON, SIZE_2X2);
  out.push("RAMSERVICE", nl);
  out.push(SIZE_1X1, BOLD_OFF);
  out.push(hr);

  // ===== SCHEDA molto evidente =====
  out.push(ALIGN_CENTER, BOLD_ON, SIZE_2X2);
  out.push("SCHEDA ", numeroScheda, nl);
  out.push(SIZE_1X1, BOLD_OFF);

  // Tipo/Data
  out.push(ALIGN_CENTER, BOLD_ON, SIZE_2X1);
  out.push(type, nl);
  out.push(SIZE_1X1, BOLD_OFF);
  if (dataIngresso) {
    out.push(ALIGN_CENTER, SIZE_2X1);
    out.push("DATA ", dataIngresso, nl);
    out.push(SIZE_1X1);
  }
  out.push(hr);

  // ===== BLOCCO DETTAGLI (tutto più grande) =====
  out.push(ALIGN_LEFT, BOLD_ON, SIZE_2X1);
  out.push("CLIENTE", nl);
  out.push(BOLD_OFF);
  wrap(cliente, 28).forEach(l => out.push(l, nl));
  if (telefono) out.push("TEL: ", telefono, nl);
  out.push(SIZE_1X1, hr);

  out.push(ALIGN_LEFT, BOLD_ON, SIZE_2X1);
  out.push("DISPOSITIVO", nl);
  out.push(BOLD_OFF);
  wrap(dispositivo, 28).forEach(l => out.push(l, nl));
  if (seriale) out.push("SN: ", seriale, nl);
  out.push(SIZE_1X1, hr);

  if (difetto) {
    out.push(ALIGN_LEFT, BOLD_ON, SIZE_2X1);
    out.push("DIFETTO", nl);
    out.push(BOLD_OFF);
    wrap(difetto, 28).forEach(l => out.push(l, nl));
    out.push(SIZE_1X1, hr);
  }

  // ===== COSTO: mega leggibile, NIENTE underline, NIENTE riga strana =====
  out.push(ALIGN_CENTER, BOLD_ON, SIZE_2X2);
  out.push("COSTO", nl);
  out.push(SIZE_2X2);
  out.push(costo, nl);
  out.push(SIZE_1X1, BOLD_OFF);

  // ===== FEED + CUT =====
  out.push(nl, nl, nl, nl);
  out.push(LINE_SP_DEF);
  out.push(cut);
  out.push("\x00");

  return out.join("");
}

(async function(){
  try {
    log("Connessione QZ…");
    await qz.websocket.connect();
    log("QZ connesso ✅", "ok");

    log("Leggo dati etichetta…");
    const data = await fetchLabelData();

    if (!data.ok) throw new Error("Risposta backend ok=false");

    // 🔍 LOG CHIAVE: così vedi subito se backend ti manda 25072
    log(`BACKEND -> numeroScheda=${data.numeroScheda} (_ragicId=${data._ragicId || "-"})`, "warn");

    const raw = escposText(data);

    log("Stampa in corso…");
    const config = qz.configs.create(PRINTER_NAME);
    await qz.print(config, [{ type: "raw", format: "command", data: raw }]);

    log("Stampato ✅", "ok");
    setTimeout(() => window.close(), 800);

  } catch (e) {
    log("ERRORE: " + (e.message || e), "err");
  }
})();
</script>
</body>
</html>
