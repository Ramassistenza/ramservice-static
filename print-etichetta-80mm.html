<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stampa Etichetta 80mm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/qz-tray/qz-tray.js"></script>
  <style>
    body { font-family: monospace; background:#111; color:#0f0; }
    pre { white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <pre id="log"></pre>

<script>
const log = msg => {
  document.getElementById('log').innerText += msg + "\n";
  console.log(msg);
};

// ✅ METTI QUI IL NOME ESATTO DELLA STAMPANTE IN WINDOWS
const PRINTER_NAME = "Aclas Printer";

// ✅ METTI QUI IL TUO CLOUD RUN
const BACKEND_BASE = "https://ramservice-signature-721276708443.europe-west1.run.app"; // <-- sostituisci

function getParam(name) {
  const url = new URL(window.location.href);
  return url.searchParams.get(name);
}

async function getLabelById(id, type) {
  const url = `${BACKEND_BASE}/print-label-by-id?id=${encodeURIComponent(id)}&type=${encodeURIComponent(type||"accettazione")}`;
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("Errore backend " + res.status);
  return res.json();
}

function clip(s, n){
  s = String(s || "").replace(/\s+/g," ").trim();
  if (!s) return "";
  return s.length > n ? s.slice(0, n-1) + "…" : s;
}

(async function(){
  try {
    const id = getParam("id");
    const type = getParam("type") || "accettazione";
    if (!id) throw new Error("Parametro ?id mancante");

    log("Connessione QZ Tray...");
    await qz.websocket.connect();

    log("Leggo dati etichetta...");
    const data = await getLabelById(id, type);
    if (!data.ok) throw new Error("Dati non validi");

    // ====== Testo 80mm (ESC/POS) ======
    const lines = [
      "\x1B\x40",           // init
      "\x1B\x61\x01",       // center
      "\x1B\x21\x20",       // bold + double height (dipende da stampante)
      "RAMSERVICE\n",
      "\x1B\x21\x00",
      "------------------------------\n",
      "\x1B\x61\x00",       // left

      `SCHEDA: ${data.numeroScheda || ""}\n`,
      `DATA:   ${data.dataIngresso || ""}\n`,
      "------------------------------\n",
      `CL: ${clip(data.cliente, 28)}\n`,
      `TEL:${clip(data.telefono, 28)}\n`,
      "------------------------------\n",
      `DEV: ${clip(data.dispositivo, 28)}\n`,
      `SN:  ${clip(data.seriale, 28)}\n`,
      `GAR: ${clip(data.garanzia, 28)}\n`,
      "------------------------------\n",
      "DIFETTO:\n",
      `${clip(data.difetto, 120)}\n`,
      "------------------------------\n",
      `ACCONTO: ${data.acconto || "0"} EUR\n`,
      `TOTALE:  ${data.costo   || "0"} EUR\n`,
      "\n\n\n",
      "\x1D\x56\x41",       // cut
      "\x00"
    ].join("");

    const cfg = qz.configs.create(PRINTER_NAME);

    log("Stampa...");
    await qz.print(cfg, [{ type:'raw', format:'command', data: lines }]);

    log("OK stampato. Chiudo...");
    setTimeout(() => window.close(), 800);

  } catch (e) {
    log("ERRORE: " + (e.message || e));
    setTimeout(() => window.close(), 2500);
  }
})();
</script>
</body>
</html>
