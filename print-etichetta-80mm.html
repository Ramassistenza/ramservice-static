<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stampa Etichetta 80mm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/qz-tray/qz-tray.js"></script>
  <style>
    body { font-family: monospace; background:#111; color:#0f0; padding:12px; }
    .ok { color:#0f0; }
    .err { color:#f55; }
    .warn { color:#ff0; }
    pre { white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <pre id="log"></pre>

<script>
const logEl = document.getElementById("log");
const log = (msg, cls="") => {
  logEl.innerHTML += (cls ? `<span class="${cls}">` : "") + msg + (cls ? `</span>` : "") + "\n";
  console.log(msg);
};

function getParam(name) {
  return new URL(window.location.href).searchParams.get(name);
}

function looksLikePlaceholder(v){
  return /^\s*\$\{.*\}\s*$/.test(String(v || ""));
}

function onlyDigits(v){
  return String(v || "").replace(/\D+/g, "");
}

// ✅ METTI QUI IL TUO CLOUD RUN (base url)
const BACKEND_BASE = "https://ramservice-signature-721276708443.europe-west1.run.app";

// Nome stampante QZ
const PRINTER_NAME = "Aclas Printer";

async function fetchLabelData() {
  const type = (getParam("type") || "accettazione").toLowerCase();

  // prendo parametri
  const idRaw = getParam("id");
  const numeroRaw = getParam("numero");

  // se Ragic lascia ${...} non li considero validi
  const id = (!idRaw || looksLikePlaceholder(idRaw)) ? "" : onlyDigits(idRaw);
  const numero = (!numeroRaw || looksLikePlaceholder(numeroRaw)) ? "" : onlyDigits(numeroRaw);

  log("PAGE URL: " + window.location.href, "warn");
  log(`PARAMS id=${idRaw} → ${id || "-"} | numero=${numeroRaw} → ${numero || "-"} | type=${type}`);

  // 🔒 REGOLA SAFE:
  // - se hai id OK puoi stampare
  // - se id non c'è / non è valido, allora DEVI passare numero
  if (!id && !numero) {
    throw new Error("Parametro mancante: serve ?id=... oppure ?numero=... (Ragic non ha sostituito i placeholder)");
  }

  const qs = new URLSearchParams();
  if (id) qs.set("id", id);
  if (numero) qs.set("numero", numero);
  qs.set("type", type);
  qs.set("_", Date.now()); // cache-bust

  const url = `${BACKEND_BASE}/api/label?${qs.toString()}`;
  log("GET " + url);

  const res = await fetch(url, { method: "GET", cache: "no-store" });
  const txt = await res.text();

  if (!res.ok) {
    throw new Error(`Backend ${res.status}: ${txt}`);
  }

  const json = JSON.parse(txt);
  return json;
}

function escposText(label) {
  // ===== helpers =====
  const nl = "\n";
  const cut = "\x1D\x56\x41";               // partial cut
  const beep = "\x1B\x42\x02\x03";          // beep (non tutte le stampanti)
  const hr = "------------------------------------------" + nl;

  // pulizia testi lunghi
  const clean = (s) =>
    String(s || "")
      .replace(/\r/g, "")
      .replace(/[ \t]+/g, " ")
      .trim();

  // wrap per 80mm: 42 char circa (font A)
  const wrap = (text, width = 42) => {
    const t = clean(text);
    if (!t) return [];
    const words = t.split(" ");
    const out = [];
    let line = "";
    for (const w of words) {
      if (!line) {
        line = w;
      } else if ((line + " " + w).length <= width) {
        line += " " + w;
      } else {
        out.push(line);
        line = w;
      }
    }
    if (line) out.push(line);
    return out;
  };

  // ===== ESC/POS quality (più scuro possibile) =====
  // NOTA: alcuni comandi variano per modello. Questi sono abbastanza “safe”
  const INIT = "\x1B\x40";

  // stampa più scura: density/energy/slow
  // 1) Print speed più lenta (se supportato)
  const SLOW_PRINT = "\x1F\x11\x02";

  // 2) “Density” alta (alcuni modelli la interpretano)
  const DENSITY_HIGH = "\x1D\x7C\x0A";

  // 3) Heat time/interval (molte termiche ESC/POS compatibili)
  //    GS ( E pL pH fn m t n  (fn=2) — set print density/heat
  //    Questo è un “best effort”; se la tua stampante lo ignora, non fa danni.
  const HEAT_STRONG = "\x1D\x28\x45\x04\x00\x02\x08\x02\x02";

  // ===== text styles =====
  const ALIGN_LEFT = "\x1B\x61\x00";
  const ALIGN_CENTER = "\x1B\x61\x01";
  const BOLD_ON = "\x1B\x45\x01";
  const BOLD_OFF = "\x1B\x45\x00";
  const UNDER_ON = "\x1B\x2D\x01";
  const UNDER_OFF = "\x1B\x2D\x00";
  const FONT_A = "\x1B\x4D\x00"; // più leggibile
  const SIZE_1X1 = "\x1D\x21\x00";
  const SIZE_2X2 = "\x1D\x21\x11"; // grande
  const SIZE_2X1 = "\x1D\x21\x10"; // alto
  const SIZE_1X2 = "\x1D\x21\x01"; // largo

  // ===== fields =====
  const numeroScheda = clean(label.numeroScheda);
  const type = clean(label.type).toUpperCase();
  const dataIngresso = clean(label.dataIngresso);
  const cliente = clean(label.cliente);
  const telefono = clean(label.telefono);
  const dispositivo = clean(label.dispositivo);
  const seriale = clean(label.seriale);
  const difetto = clean(label.difetto);
  const costo = clean(label.costo);

  const lines = [];

  // ===== INIT + qualità =====
  lines.push(INIT);
  lines.push(FONT_A);
  lines.push(SLOW_PRINT);
  lines.push(DENSITY_HIGH);
  lines.push(HEAT_STRONG);

  // ===== HEADER =====
  lines.push(ALIGN_CENTER);
  lines.push(BOLD_ON);
  lines.push(SIZE_2X2);
  lines.push("RAMSERVICE" + nl);
  lines.push(SIZE_1X1);
  lines.push(BOLD_OFF);

  lines.push(hr);

  // ===== SCHEDA (molto evidente) =====
  lines.push(ALIGN_CENTER);
  lines.push(BOLD_ON);
  lines.push(SIZE_2X2);
  lines.push("SCHEDA " + (numeroScheda || "-") + nl);
  lines.push(SIZE_1X1);
  lines.push(BOLD_OFF);

  lines.push(ALIGN_LEFT);
  lines.push(`TIPO: ${type || "-"}` + nl);
  if (dataIngresso) lines.push(`DATA: ${dataIngresso}` + nl);
  lines.push(hr);

  // ===== CLIENTE =====
  lines.push(BOLD_ON);
  lines.push("CLIENTE" + nl);
  lines.push(BOLD_OFF);
  wrap(cliente || "-", 42).forEach(l => lines.push(l + nl));
  if (telefono) lines.push("TEL: " + telefono + nl);
  lines.push(hr);

  // ===== DISPOSITIVO =====
  lines.push(BOLD_ON);
  lines.push("DISPOSITIVO" + nl);
  lines.push(BOLD_OFF);

  // device un po’ più grande
  lines.push(SIZE_2X1);
  wrap(dispositivo || "-", 32).forEach(l => lines.push(l + nl));
  lines.push(SIZE_1X1);

  if (seriale) {
    lines.push("SN: " + seriale + nl);
  }
  lines.push(hr);

  // ===== DIFETTO =====
  if (difetto) {
    lines.push(BOLD_ON);
    lines.push("DIFETTO" + nl);
    lines.push(BOLD_OFF);
    wrap(difetto, 42).forEach(l => lines.push(l + nl));
    lines.push(hr);
  }

  // ===== COSTO (mega bold) =====
  lines.push(ALIGN_CENTER);
  lines.push(BOLD_ON);
  lines.push(UNDER_ON);
  lines.push(SIZE_2X2);
  lines.push((costo ? `€ ${costo.replace("€", "").trim()}` : "€ -") + nl);
  lines.push(SIZE_1X1);
  lines.push(UNDER_OFF);
  lines.push(BOLD_OFF);

  lines.push(nl);
  lines.push(ALIGN_CENTER);
  lines.push("Grazie! Conserva questa etichetta." + nl);

  // ===== FEED + CUT =====
  lines.push(nl + nl + nl);
  lines.push(beep); // se non supportato, viene ignorato
  lines.push(cut);
  lines.push("\x00");

  return lines.join("");
}

(async function(){
  try {
    log("Connessione QZ…");
    await qz.websocket.connect();
    log("QZ connesso ✅", "ok");

    log("Leggo dati etichetta…");
    const data = await fetchLabelData();

    if (!data.ok) throw new Error("Risposta backend ok=false");

    // 🔍 LOG CHIAVE: così vedi subito se backend ti manda 25072
    log(`BACKEND -> numeroScheda=${data.numeroScheda} (_ragicId=${data._ragicId || "-"})`, "warn");

    const raw = escposText(data);

    log("Stampa in corso…");
    const config = qz.configs.create(PRINTER_NAME);
    await qz.print(config, [{ type: "raw", format: "command", data: raw }]);

    log("Stampato ✅", "ok");
    setTimeout(() => window.close(), 800);

  } catch (e) {
    log("ERRORE: " + (e.message || e), "err");
  }
})();
</script>
</body>
</html>
