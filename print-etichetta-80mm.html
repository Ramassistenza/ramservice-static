<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stampa Etichetta 80mm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/qz-tray/qz-tray.js"></script>
  <style>
    body { font-family: monospace; background:#111; color:#0f0; padding:12px; }
    .ok { color:#0f0; }
    .err { color:#f55; }
    .warn { color:#ff0; }
    pre { white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <pre id="log"></pre>

<script>
const logEl = document.getElementById("log");
const log = (msg, cls="") => {
  logEl.innerHTML += (cls ? `<span class="${cls}">` : "") + msg + (cls ? `</span>` : "") + "\n";
  console.log(msg);
};

function getParam(name) {
  return new URL(window.location.href).searchParams.get(name);
}

function looksLikePlaceholder(v){
  return /^\s*\$\{.*\}\s*$/.test(String(v || ""));
}

function onlyDigits(v){
  return String(v || "").replace(/\D+/g, "");
}

// ✅ METTI QUI IL TUO CLOUD RUN (base url)
const BACKEND_BASE = "https://ramservice-signature-721276708443.europe-west1.run.app";

// Nome stampante QZ
const PRINTER_NAME = "Aclas Printer";

async function fetchLabelData() {
  const type = (getParam("type") || "accettazione").toLowerCase();

  // prendo parametri
  const idRaw = getParam("id");
  const numeroRaw = getParam("numero");

  // se Ragic lascia ${...} non li considero validi
  const id = (!idRaw || looksLikePlaceholder(idRaw)) ? "" : onlyDigits(idRaw);
  const numero = (!numeroRaw || looksLikePlaceholder(numeroRaw)) ? "" : onlyDigits(numeroRaw);

  log("PAGE URL: " + window.location.href, "warn");
  log(`PARAMS id=${idRaw} → ${id || "-"} | numero=${numeroRaw} → ${numero || "-"} | type=${type}`);

  // 🔒 REGOLA SAFE:
  // - se hai id OK puoi stampare
  // - se id non c'è / non è valido, allora DEVI passare numero
  if (!id && !numero) {
    throw new Error("Parametro mancante: serve ?id=... oppure ?numero=... (Ragic non ha sostituito i placeholder)");
  }

  const qs = new URLSearchParams();
  if (id) qs.set("id", id);
  if (numero) qs.set("numero", numero);
  qs.set("type", type);
  qs.set("_", Date.now()); // cache-bust

  const url = `${BACKEND_BASE}/api/label?${qs.toString()}`;
  log("GET " + url);

  const res = await fetch(url, { method: "GET", cache: "no-store" });
  const txt = await res.text();

  if (!res.ok) {
    throw new Error(`Backend ${res.status}: ${txt}`);
  }

  const json = JSON.parse(txt);
  return json;
}

function escposText(label) {
  const nl = "\n";
  const cut = "\x1D\x56\x41"; // partial cut

  // ===== ESC/POS =====
  const INIT       = "\x1B\x40";
  const LEFT       = "\x1B\x61\x00";
  const CENTER     = "\x1B\x61\x01";
  const BOLD_ON    = "\x1B\x45\x01";
  const BOLD_OFF   = "\x1B\x45\x00";
  const FONT_A     = "\x1B\x4D\x00"; // font A

  const SIZE_1X1   = "\x1D\x21\x00";
  const SIZE_2X1   = "\x1D\x21\x10"; // medio (altezza doppia)
  const SIZE_2X2   = "\x1D\x21\x11"; // grande (altezza+larghezza)

  const HR  = "==========================================\n";
  const SEP = "------------------------------------------\n";
  const W = 42;

  const clean = (s) =>
    String(s ?? "")
      .replace(/\r/g, "")
      .replace(/[ \t]+/g, " ")
      .trim();

  const wrap = (text, width = W) => {
    const t = clean(text);
    if (!t) return [];
    const words = t.split(" ");
    const out = [];
    let line = "";
    for (const w of words) {
      if (!line) line = w;
      else if ((line + " " + w).length <= width) line += " " + w;
      else { out.push(line); line = w; }
    }
    if (line) out.push(line);
    return out;
  };

  const line = (label, value) => {
    const v = clean(value);
    if (!v) return "";
    const prefix = `${label}: `;
    const max = W - prefix.length;
    const rows = wrap(v, Math.max(max, 12));
    if (!rows.length) return "";
    return rows.map((row, i) => (i === 0 ? prefix : " ".repeat(prefix.length)) + row + nl).join("");
  };

  const title = (text) => [
    BOLD_ON,
    SEP,
    text + nl,
    SEP,
    BOLD_OFF
  ].join("");

  const barcodeCode128 = (value) => {
    const raw = clean(value).replace(/[^\x20-\x7E]/g, "");
    if (!raw) return "";
    const payload = "{B" + raw;
    return [
      CENTER,
      "\x1D\x48\x02",      // HRI sotto il barcode
      "\x1D\x68\x48",      // altezza
      "\x1D\x77\x02",      // larghezza modulo
      "\x1D\x6B\x49",
      String.fromCharCode(payload.length),
      payload,
      nl,
      LEFT
    ].join("");
  };

  const numeroScheda = clean(label.numeroScheda) || "-";
  const type = (clean(label.type) || "accettazione").toUpperCase();
  const dataIngresso = clean(label.dataIngresso);

  const cliente = clean(label.cliente) || "-";
  const telefono = clean(label.telefono);

  const dispositivo = clean(label.dispositivo) || "-";
  const seriale = clean(label.seriale);
  const pinSim = clean(label.pinSim);
  const codiceProtezione = clean(label.codiceProtezione);

  const difetto = clean(label.difetto);
  const costo = clean(label.costo) || "-";

  const lines = [];

  // init + tutto a sinistra
  lines.push(INIT, FONT_A, LEFT, SIZE_1X1);

  // ===== TESTATA =====
  lines.push(CENTER);
  lines.push(BOLD_ON, SIZE_2X2);
  lines.push("RAMSERVICE\n");
  lines.push(SIZE_1X1);
  lines.push("ASSISTENZA TECNICA\n");
  lines.push(BOLD_OFF);
  lines.push("Via di Macchia Saponara 104C\n");
  lines.push("00125 Roma - Tel. 06 89345782\n");
  lines.push(LEFT, HR);

  // ===== SCHEDA =====
  lines.push(CENTER, BOLD_ON, SIZE_2X2);
  lines.push(`SCHEDA ${numeroScheda}\n`);
  lines.push(SIZE_1X1, BOLD_OFF);
  lines.push(barcodeCode128(numeroScheda));
  lines.push(LEFT);

  lines.push(line("TIPO", type));
  lines.push(line("DATA", dataIngresso));

  // ===== CLIENTE =====
  lines.push(title("CLIENTE"));
  lines.push(SIZE_2X2);
  wrap(cliente, 20).forEach(l => lines.push(l + nl));
  lines.push(SIZE_1X1);
  lines.push(line("TEL", telefono));

  // ===== DISPOSITIVO =====
  lines.push(title("DISPOSITIVO"));
  lines.push(BOLD_ON, SIZE_2X1);
  wrap(dispositivo, 21).forEach(l => lines.push(l + nl));
  lines.push(SIZE_1X1, BOLD_OFF);
  lines.push(line("SERIALE", seriale));

  // ===== CODICI =====
  if (pinSim || codiceProtezione) {
    lines.push(title("CODICI CLIENTE"));
    if (pinSim) {
      lines.push(BOLD_ON, SIZE_2X1);
      lines.push(`PIN SIM: ${pinSim}\n`);
      lines.push(SIZE_1X1, BOLD_OFF);
    }
    if (codiceProtezione) {
      lines.push(BOLD_ON, SIZE_2X1);
      wrap(`CODICE: ${codiceProtezione}`, 21).forEach(l => lines.push(l + nl));
      lines.push(SIZE_1X1, BOLD_OFF);
    }
  }

  // ===== DIFETTO =====
  if (difetto) {
    lines.push(title("DIFETTO SEGNALATO"));
    lines.push(BOLD_ON);
    wrap(difetto, W).forEach(l => lines.push(l + nl));
    lines.push(BOLD_OFF);
  }

  // ===== COSTO =====
  lines.push(HR);
  lines.push(BOLD_ON, SIZE_2X1);
  lines.push(`COSTO: ${costo}\n`);
  lines.push(SIZE_1X1, BOLD_OFF);
  lines.push(HR);

  lines.push("Conservare questa ricevuta per il ritiro.\n");
  lines.push("Info e aggiornamenti: RAMSERVICE\n");

  // feed + cut
  lines.push("\n\n\n", cut, "\x00");

  return lines.join("");
}

// ===== QZ MESSAGE SIGNING =====

qz.security.setCertificatePromise(function(resolve, reject) {

  fetch("https://ramservice-signature-721276708443.europe-west1.run.app/qz/cert")
  .then(res => res.text())
  .then(resolve)
  .catch(reject);

});

qz.security.setSignatureAlgorithm("SHA512");

qz.security.setSignaturePromise(function(toSign) {

  return function(resolve, reject) {

    fetch("https://ramservice-signature-721276708443.europe-west1.run.app/qz/sign?request=" + encodeURIComponent(toSign))
    .then(res => res.text())
    .then(resolve)
    .catch(reject);

  };

});

(async function(){
  try {
    log("Connessione QZ…");
    await qz.websocket.connect();
    log("QZ connesso ✅", "ok");

    log("Leggo dati etichetta…");
    const data = await fetchLabelData();

    if (!data.ok) throw new Error("Risposta backend ok=false");

    // 🔍 LOG CHIAVE: così vedi subito se backend ti manda 25072
    log(`BACKEND -> numeroScheda=${data.numeroScheda} (_ragicId=${data._ragicId || "-"})`, "warn");

    const raw = escposText(data);

    log("Stampa in corso…");
    const config = qz.configs.create(PRINTER_NAME);
    await qz.print(config, [{ type: "raw", format: "command", data: raw }]);

    log("Stampato ✅", "ok");
    setTimeout(() => window.close(), 800);

  } catch (e) {
    log("ERRORE: " + (e.message || e), "err");
  }
})();
</script>
</body>
</html>
