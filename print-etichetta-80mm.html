<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stampa Etichetta 80mm</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/qz-tray/qz-tray.js"></script>

<style>
body{font-family:monospace;background:#111;color:#0f0;padding:12px}
.ok{color:#0f0}
.err{color:#f55}
pre{white-space:pre-wrap;word-wrap:break-word}
</style>
</head>

<body>

<pre id="log"></pre>

<script>

const logEl = document.getElementById("log");

function log(msg,cls=""){
  logEl.innerHTML += (cls?`<span class="${cls}">`:"") + msg + (cls?`</span>`:"") + "\n";
  console.log(msg);
}

function getParam(name){
  const url = new URL(window.location.href);
  return url.searchParams.get(name);
}

function onlyDigits(v){
  return String(v || "").replace(/\D+/g,"");
}

const BACKEND_BASE = "https://ramservice-signature-721276708443.europe-west1.run.app";
const PRINTER_NAME = "Aclas Printer";


async function fetchLabelData(){

  const idRaw = getParam("id");
  const numeroRaw = getParam("numero");
  const type = getParam("type") || "accettazione";

  const id = onlyDigits(idRaw);
  const numero = onlyDigits(numeroRaw);

  log(`PARAMS id=${idRaw} → ${id || "-"} numero=${numeroRaw} → ${numero || "-"} type=${type}`);

  if(!id && !numero){
    throw new Error("Parametro id o numero mancante");
  }

  const qs = new URLSearchParams();

  if(id) qs.set("id",id);
  if(numero) qs.set("numero",numero);

  qs.set("type",type);

  const url = `${BACKEND_BASE}/api/label?${qs.toString()}&_=${Date.now()}`;

  log("GET "+url);

  const res = await fetch(url);

  if(!res.ok){
    const t = await res.text().catch(()=> "");
    throw new Error(`Backend ${res.status} ${t}`);
  }

  return res.json();
}


function escposText(label){

const hr="==========================================\n";
const cut="\x1D\x56\x41";

const lines=[];

lines.push("\x1B\x40");
lines.push("\x1B\x61\x01");
lines.push("\x1B\x21\x20");
lines.push("RAMSERVICE\n");
lines.push("\x1B\x21\x00");
lines.push(hr);

lines.push("\x1B\x61\x00");

lines.push(`SCHEDA: ${label.numeroScheda}\n`);
lines.push(`TIPO: ${(label.type||"").toUpperCase()}\n`);

if(label.dataIngresso)
lines.push(`DATA: ${label.dataIngresso}\n`);

lines.push("------------------------------------------\n");

lines.push(`CLIENTE: ${label.cliente}\n`);

if(label.telefono)
lines.push(`TEL: ${label.telefono}\n`);

lines.push("------------------------------------------\n");

lines.push(`DEVICE: ${label.dispositivo}\n`);

if(label.seriale)
lines.push(`SN: ${label.seriale}\n`);

lines.push("------------------------------------------\n");

if(label.difetto){
lines.push("DIFETTO:\n");
lines.push(label.difetto+"\n");
lines.push("------------------------------------------\n");
}

lines.push("\x1B\x61\x01");
lines.push("\x1B\x45\x01");
lines.push(`COSTO: ${label.costo}\n`);
lines.push("\x1B\x45\x00");

lines.push(hr);

lines.push("\n\n\n");
lines.push(cut);
lines.push("\x00");

return lines.join("");
}



(async function(){

try{

log("Connessione QZ…");

await qz.websocket.connect();

log("QZ connesso ✅","ok");

log("Leggo dati etichetta…");

const data = await fetchLabelData();

if(!data.ok) throw new Error("Risposta non ok");

log("Dati ricevuti ✅","ok");

const config=qz.configs.create(PRINTER_NAME);

const raw=escposText(data);

log("Stampa in corso…");

await qz.print(config,[{type:"raw",format:"command",data:raw}]);

log("Stampato ✅","ok");

setTimeout(()=>window.close(),800);

}catch(e){

log("ERRORE: "+(e.message||e),"err");

}

})();

</script>

</body>
</html>
