<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RAMSERVICE Config JSON</title>
<style>
body{font-family:sans-serif;padding:20px;background:#f5f5f5;}
textarea{width:100%;height:400px;font-family:monospace;padding:10px;}
button{margin-top:10px;padding:10px 16px;background:#0071E3;color:#fff;border:0;border-radius:6px;cursor:pointer;}
pre{background:#fff;padding:10px;border-radius:8px;}
</style>
</head>
<body>
<h2>⚙️ RAMSERVICE · Configuratore JSON</h2>
<p>Modifica la configurazione e clicca “Genera JSON” per aggiornare il file <code>ramdata.json</code> nel tuo repository GitHub Pages.</p>
<textarea id="jsonInput"></textarea>
<button id="generate">Genera JSON</button>
<pre id="output"></pre>

<script>
const tpl={
  users:[{name:"Andrea",user:"andrea",pass:"1234"}],
  config:{
    GENNAIO:{
      fatt:{base:200,x1_thr:28000,x1_prize:50,x2_thr:30000,x2_prize:100},
      wind:{base:50,x1_thr:20,x1_prize:20,x2_thr:25,x2_prize:50},
      ho:{base:50,x1_thr:20,x1_prize:20,x2_thr:25,x2_prize:50}
    }
  }
};
document.getElementById("jsonInput").value=JSON.stringify(tpl,null,2);
document.getElementById("generate").onclick=()=>{
  try{
    const obj=JSON.parse(document.getElementById("jsonInput").value);
    document.getElementById("output").textContent=JSON.stringify(obj,null,2);
    alert("✅ JSON valido — copia questo testo e incollalo nel file ramdata.json su GitHub");
  }catch(e){
    alert("❌ Errore nel formato JSON: "+e.message);
  }
};
</script>
</body>
</html>
