<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMSERVICE Configuratore</title>
<style>
body{font-family:Poppins,sans-serif;background:#f5f5f5;padding:20px}
h2{color:#0071E3}
textarea{width:100%;height:420px;padding:10px;font-family:monospace;border-radius:8px;border:1px solid #ccc}
button{background:#0071E3;color:#fff;padding:10px 20px;border:0;border-radius:8px;cursor:pointer;margin-top:10px}
pre{background:#fff;padding:10px;border-radius:8px;overflow:auto}
</style>
</head>
<body>
<h2>⚙️ RAMSERVICE — Generatore JSON</h2>
<p>Compila qui sotto utenti e configurazioni, poi clicca <b>Genera JSON</b> e incolla il risultato su <code>ramdata.json</code> nel tuo repo GitHub.</p>

<textarea id="input" placeholder="Inserisci qui il tuo JSON"></textarea>
<button id="generate">Genera JSON</button>
<pre id="output"></pre>

<script>
const template={
  users:[
    {name:"Andrea",user:"andrea",pass:"1234"},
    {name:"Emanuele",user:"emanuele",pass:"abcd"}
  ],
  config:{
    GENNAIO:{
      fatt:{base:200,x1_thr:28000,x1_prize:50,x2_thr:30000,x2_prize:100},
      wind:{base:50,x1_thr:20,x1_prize:20,x2_thr:25,x2_prize:50},
      ho:{base:50,x1_thr:20,x1_prize:20,x2_thr:25,x2_prize:50}
    }
  }
};
document.getElementById("input").value=JSON.stringify(template,null,2);

document.getElementById("generate").onclick=()=>{
  try{
    const obj=JSON.parse(document.getElementById("input").value);
    document.getElementById("output").textContent=JSON.stringify(obj,null,2);
    alert("✅ JSON valido! Copia e incolla nel file ramdata.json sul tuo GitHub.");
  }catch(e){
    alert("❌ Errore nel formato JSON: "+e.message);
  }
};
</script>
</body>
</html>
