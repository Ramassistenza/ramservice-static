<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAMONITOR — Slideshow</title>
  <style>
    html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; background:#000; }
    .rotated {
      position:fixed; top:0; left:0;
      width:100vh; height:100vw;
      transform:rotate(90deg) translateY(-100%);
      transform-origin:top left;
      background:#000; overflow:hidden;
    }
    .layer {
      position:absolute; inset:0;
      background-position:center center;
      background-size:cover;
      background-repeat:no-repeat;
      opacity:0;
      transition:opacity .5s linear;
      will-change: opacity, background-image;
    }
    .layer.show { opacity:1; }
  </style>
</head>
<body>
  <div class="rotated" id="stage">
    <div class="layer" id="A" aria-hidden="true"></div>
    <div class="layer" id="B" aria-hidden="true"></div>
  </div>

  <script>
    // =============================
    // CONFIG
    // =============================
    const MANIFEST_URL = "https://ramonitor-api-721276708443.europe-west1.run.app/manifest.json";
    const IMG_BASE = "https://storage.googleapis.com/ramonitor-images/img/";
    const SLIDE_SECONDS = 7;           // durata slide
    const REFRESH_MINUTES = 5;         // ogni quanto rileggere la cartella
    const FULLSCREEN_PING_SEC = 60;    // tenta fullscreen periodico
    const KEEPALIVE_VIDEO_SEC = 25;    // riprodurre/riavviare il video
    const AUDIO_PING_SEC = 30;         // ping audio a volume ~0
    const NET_PING_SEC = 45;           // richiesta rete periodica
    const RAF_JIGGLE_MS = 2000;        // micro attività su GPU/JS

    let IMAGES = [];
    let index = 0;
    let showingA = true;
    const A = document.getElementById("A");
    const B = document.getElementById("B");
    const stage = document.getElementById("stage");

    // =============================
    // SLIDESHOW
    // =============================
  

    function showNext() {
      if (!IMAGES.length) return;
      const next = IMAGES[index % IMAGES.length];
      const front = showingA ? A : B;
      const back  = showingA ? B : A;
      // Precaricamento leggero: assegna, poi forza repaint
      back.style.backgroundImage = `url("${next}")`;
      // switch
      back.classList.add("show");
      front.classList.remove("show");
      showingA = !showingA;
      index++;
    }

    async function refreshImageList() {
      try {
        const res = await fetch(MANIFEST_URL + "?t=" + Date.now(), { cache: "no-store" });
        const list = await res.json();

        if (Array.isArray(list) && list.length) {
          IMAGES = list.map(f =>
            IMG_BASE + encodeURIComponent(f) + "?t=" + Date.now()
          );
          index = index % IMAGES.length;
        }
      } catch (e) {
        console.warn("Errore caricamento manifest:", e);
      }
    }


    // =============================
    // AVVIO
    // =============================
    let slideTimer = null;
    let refreshTimer = null;

    async function startSlideshow() {
      await refreshImageList();
      showNext();
      clearInterval(slideTimer);
      slideTimer = setInterval(showNext, SLIDE_SECONDS * 1000);
      clearInterval(refreshTimer);
      refreshTimer = setInterval(refreshImageList, REFRESH_MINUTES * 60 * 1000);
    }

    // =============================
    // ANTISTANDBY “MULTI-LEVA”
    // =============================

    // 1) Wake Lock API (se presente)
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('🔒 Wake Lock attivo');
          wakeLock.addEventListener?.('release', () => {
            console.log('🔓 Wake Lock rilasciato, ritento…');
          });
        } else {
          console.log('Wake Lock non supportato');
        }
      } catch (e) {
        console.warn('Wake Lock errore:', e);
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
    window.addEventListener('focus', requestWakeLock);

    // 2) Fullscreen periodico (alcuni webOS tengono “vivo” lo schermo)
    async function goFullscreen() {
      try {
        const el = document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) await el.requestFullscreen();
      } catch (e) { /* ignorato */ }
    }
    setInterval(goFullscreen, FULLSCREEN_PING_SEC * 1000);
    // primo tentativo all’avvio
    goFullscreen();

    // 3) Video invisibile keep-alive con restart periodico
    const keepAlive = document.createElement("video");
    keepAlive.src = "keepalive.mp4";
    keepAlive.autoplay = true;
    keepAlive.loop = true;
    keepAlive.muted = true;
    keepAlive.playsInline = true;
    keepAlive.setAttribute('playsinline','');
    keepAlive.style = "position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;top:-10px;";
    document.body.appendChild(keepAlive);

    // Alcuni browser sospendono i media dopo tot minuti: “stuzzica” il player
    setInterval(() => {
      try {
        keepAlive.currentTime = 0;
        keepAlive.play().catch(()=>{});
      } catch(e){}
    }, KEEPALIVE_VIDEO_SEC * 1000);

    // 4) AudioContext ping (volume ~0)
    let audioCtx = null;
    function nudgeAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        gain.gain.value = 0.0001; // praticamente muto
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();
        setTimeout(() => { try { osc.stop(); } catch(e){} }, 200);
      } catch (e) {
        console.log('AudioContext non disponibile', e);
      }
    }
    setInterval(nudgeAudio, AUDIO_PING_SEC * 1000);

    // 5) Ping rete periodico (mantiene vivo lo stack)
    function netPing() {
      const url = `${location.href.split('#')[0]}?ping=${Date.now()}`;
      fetch(url, { cache: 'no-store', mode: 'no-cors' }).catch(()=>{});
      // ping anche su un’immagine inesistente
      const img = new Image();
      img.src = `${IMG_FOLDER}/__ping__.png?t=${Date.now()}`;
    }
    setInterval(netPing, NET_PING_SEC * 1000);

    // 6) Micro-interazione JS/GPU via requestAnimationFrame
    (function rafJiggle(){
      const t0 = performance.now();
      function spin(now){
        // piccolissima attività di layout/paint
        stage.style.transform = `rotate(90deg) translateY(-100%) translateZ(0)`;
        if (now - t0 < RAF_JIGGLE_MS) {
          requestAnimationFrame(spin);
        } else {
          setTimeout(rafJiggle, 30000); // ripeti ogni 30s
        }
      }
      requestAnimationFrame(spin);
    })();

    // 7) Finta attività utente (alcuni browser la ignorano, non nuoce)
    setInterval(() => {
      window.dispatchEvent(new Event("mousemove"));
      window.dispatchEvent(new Event("keydown"));
      document.body.click?.();
    }, 30000);

    // 8) Riprendi tutto al “risveglio” della pagina
    window.addEventListener('pageshow', () => {
      requestWakeLock();
      goFullscreen();
      keepAlive.play().catch(()=>{});
      nudgeAudio();
      netPing();
      // riavvia timers slideshow se interrotti
      if (!slideTimer) slideTimer = setInterval(showNext, SLIDE_SECONDS * 1000);
      if (!refreshTimer) refreshTimer = setInterval(refreshImageList, REFRESH_MINUTES * 60 * 1000);
    });

    // =============================
    // BOOT
    // =============================
    (async function boot(){
      await startSlideshow();
      await requestWakeLock();
      // Primo “nudge” multicanale
      goFullscreen(); nudgeAudio(); netPing();
      keepAlive.play().catch(()=>{});
    })();
  </script>
</body>
</html>
