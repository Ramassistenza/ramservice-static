<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAMONITOR — Slideshow</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }

    .rotated {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vh;
      height: 100vw;
      transform: rotate(90deg) translateY(-100%);
      transform-origin: top left;
      background: #000;
      overflow: hidden;
    }

    .layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 0;
      transition: opacity .5s linear;
      will-change: opacity;
    }

    .layer.show {
      opacity: 1;
    }

    .layer img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="rotated" id="stage">
    <div class="layer" id="A" aria-hidden="true"></div>
    <div class="layer" id="B" aria-hidden="true"></div>
  </div>

  <script src="player-cache.js"></script>
  <script>
    // =============================
    // CONFIG
    // =============================
    const MANIFEST_URL = "https://ramonitor-api-721276708443.europe-west1.run.app/manifest-vertical.json";
    const REFRESH_MINUTES = 5;
    const FULLSCREEN_PING_SEC = 60;
    const KEEPALIVE_VIDEO_SEC = 25;
    const AUDIO_PING_SEC = 30;
    const NET_PING_SEC = 45;
    const RAF_JIGGLE_MS = 2000;

    let showingA = true;

    const A = document.getElementById("A");
    const B = document.getElementById("B");
    const stage = document.getElementById("stage");

    let wakeLock = null;
    let audioCtx = null;

    function renderSlide(image) {
      const front = showingA ? A : B;
      const back  = showingA ? B : A;

      if (back.firstChild !== image) {
        back.textContent = "";
        back.appendChild(image);
      }
      back.classList.add("show");
      front.classList.remove("show");
      showingA = !showingA;
    }

    // =============================
    // ANTISTANDBY
    // =============================
    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator) {
          wakeLock = await navigator.wakeLock.request("screen");
          console.log("🔒 Wake Lock attivo");
          wakeLock.addEventListener?.("release", () => {
            console.log("🔓 Wake Lock rilasciato");
          });
        } else {
          console.log("Wake Lock non supportato");
        }
      } catch (e) {
        console.warn("Wake Lock errore:", e);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        requestWakeLock();
      }
    });

    window.addEventListener("focus", requestWakeLock);

    async function goFullscreen() {
      try {
        const el = document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) {
          await el.requestFullscreen();
        }
      } catch (e) {}
    }

    setInterval(goFullscreen, FULLSCREEN_PING_SEC * 1000);
    goFullscreen();

    // Video keepalive locale
    const keepAlive = document.createElement("video");
    keepAlive.src = "keepalive.mp4";
    keepAlive.autoplay = true;
    keepAlive.loop = true;
    keepAlive.muted = true;
    keepAlive.playsInline = true;
    keepAlive.setAttribute("playsinline", "");
    keepAlive.style = "position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;top:-10px;";
    document.body.appendChild(keepAlive);

    setInterval(() => {
      try {
        keepAlive.currentTime = 0;
        keepAlive.play().catch(() => {});
      } catch (e) {}
    }, KEEPALIVE_VIDEO_SEC * 1000);

    function nudgeAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        gain.gain.value = 0.0001;
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();

        setTimeout(() => {
          try { osc.stop(); } catch (e) {}
        }, 200);
      } catch (e) {
        console.log("AudioContext non disponibile", e);
      }
    }

    setInterval(nudgeAudio, AUDIO_PING_SEC * 1000);

    // Ping rete SENZA colpire Cloud Storage
    function netPing() {
      const url = `${location.origin}${location.pathname}?ping=${Date.now()}`;
      fetch(url, {
        cache: "no-store",
        mode: "no-cors"
      }).catch(() => {});
    }

    setInterval(netPing, NET_PING_SEC * 1000);

    (function rafJiggle() {
      const t0 = performance.now();

      function spin(now) {
        stage.style.transform = "rotate(90deg) translateY(-100%) translateZ(0)";
        if (now - t0 < RAF_JIGGLE_MS) {
          requestAnimationFrame(spin);
        } else {
          setTimeout(rafJiggle, 30000);
        }
      }

      requestAnimationFrame(spin);
    })();

    setInterval(() => {
      window.dispatchEvent(new Event("mousemove"));
      window.dispatchEvent(new Event("keydown"));
      if (document.body.click) {
        try { document.body.click(); } catch (e) {}
      }
    }, 30000);

    window.addEventListener("pageshow", () => {
      requestWakeLock();
      goFullscreen();
      keepAlive.play().catch(() => {});
      nudgeAudio();
      netPing();

    });

    // =============================
    // BOOT
    // =============================
    (async function boot() {
      startRAMonitor({
        orientation: "vertical",
        manifest: MANIFEST_URL,
        refreshMs: REFRESH_MINUTES * 60 * 1000,
        keepOnEmpty: true,
        render: renderSlide
      });
      await requestWakeLock();
      goFullscreen();
      nudgeAudio();
      netPing();
      keepAlive.play().catch(() => {});
    })();
  </script>
</body>
</html>
