<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAMONITOR — Slideshow</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    .rotated {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vh;
      height: 100vw;
      transform: rotate(90deg) translateY(-100%);
      transform-origin: top left;
      background: #000;
      overflow: hidden;
    }
    .layer {
      position: absolute;
      inset: 0;
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.5s linear;
      will-change: opacity;
    }
    .layer.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="rotated">
    <div class="layer" id="A"></div>
    <div class="layer" id="B"></div>
  </div>

  <script>
    const IMAGES = [
      "img/01.jpg",
      "img/02.jpg",
      "img/03.jpg"
    ];

    let index = 0;
    let showingA = true;
    const A = document.getElementById("A");
    const B = document.getElementById("B");

    function showNext() {
      const next = IMAGES[index % IMAGES.length];
      const front = showingA ? A : B;
      const back  = showingA ? B : A;
      back.style.backgroundImage = `url("${next}?t=${Date.now()}")`;
      back.classList.add("show");
      front.classList.remove("show");
      showingA = !showingA;
      index++;
    }

    function startSlideshow() {
      showNext();
      setInterval(showNext, 7000); // 7 secondi per slide
    }

    startSlideshow();

    // 🔄 Ricarica ogni 5 minuti
    setInterval(() => location.reload(), 300000);

    // ⚡ Mantieni attivo lo schermo (LG workaround)
    setInterval(() => window.dispatchEvent(new Event("mousemove")), 30000);

    // 🎬 Video invisibile per evitare standby video
    const keepAlive = document.createElement("video");
    keepAlive.src = "keepalive.mp4";
    keepAlive.autoplay = true;
    keepAlive.loop = true;
    keepAlive.muted = true;
    keepAlive.playsInline = true;
    keepAlive.style = "position:fixed;width:1px;height:1px;opacity:0;";
    document.body.appendChild(keepAlive);
  </script>
</body>
</html>
