<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAMONITOR — Slideshow</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }

    .rotated {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vh;
      height: 100vw;
      transform: rotate(90deg) translateY(-100%);
      transform-origin: top left;
      background: #000;
      overflow: hidden;
    }

    .layer {
      position: absolute;
      inset: 0;
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity .5s linear;
      will-change: opacity;
    }

    .layer.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="rotated" id="stage">
    <div class="layer" id="A" aria-hidden="true"></div>
    <div class="layer" id="B" aria-hidden="true"></div>
  </div>

  <script>
    // =============================
    // CONFIG
    // =============================
    const MANIFEST_URL = "https://ramonitor-api-721276708443.europe-west1.run.app/manifest-vertical.json";
    const IMG_BASE = "https://storage.googleapis.com/ramonitor-images/img/vertical/";
    const SLIDE_SECONDS = 7;
    const REFRESH_MINUTES = 5;
    const FULLSCREEN_PING_SEC = 60;
    const KEEPALIVE_VIDEO_SEC = 25;
    const AUDIO_PING_SEC = 30;
    const NET_PING_SEC = 45;
    const RAF_JIGGLE_MS = 2000;

    // Preload in memoria per evitare richieste duplicate durante il loop
    const imageCache = new Map();

    let IMAGES = [];
    let index = 0;
    let showingA = true;

    const A = document.getElementById("A");
    const B = document.getElementById("B");
    const stage = document.getElementById("stage");

    let slideTimer = null;
    let refreshTimer = null;
    let wakeLock = null;
    let audioCtx = null;

    // =============================
    // UTILS
    // =============================
    function arraysEqual(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return false;
      }
      return true;
    }

    function preloadImage(url) {
      return new Promise((resolve) => {
        if (imageCache.has(url)) {
          const cached = imageCache.get(url);
          if (cached.complete) {
            resolve(cached);
            return;
          }
        }

        const img = new Image();
        img.decoding = "async";
        img.loading = "eager";

        img.onload = () => {
          imageCache.set(url, img);
          resolve(img);
        };

        img.onerror = () => {
          console.warn("Errore preload immagine:", url);
          resolve(null);
        };

        img.src = url;
        imageCache.set(url, img);
      });
    }

    function preloadNextImage() {
      if (!IMAGES.length) return;
      const nextIndex = index % IMAGES.length;
      const nextUrl = IMAGES[nextIndex];
      preloadImage(nextUrl).catch(() => {});
    }

    // =============================
    // SLIDESHOW
    // =============================
    async function showNext() {
      if (!IMAGES.length) return;

      const next = IMAGES[index % IMAGES.length];
      const front = showingA ? A : B;
      const back  = showingA ? B : A;

      const preloaded = await preloadImage(next);
      if (!preloaded) return;

      back.style.backgroundImage = `url("${next}")`;
      back.classList.add("show");
      front.classList.remove("show");

      showingA = !showingA;
      index++;

      // preload anticipato della successiva
      preloadNextImage();
    }

    async function refreshImageList() {
      try {
        // Solo il manifest ha bust cache, NON le immagini
        const res = await fetch(`${MANIFEST_URL}?t=${Date.now()}`, {
          cache: "no-store"
        });

        if (!res.ok) {
          throw new Error(`Manifest HTTP ${res.status}`);
        }

        const list = await res.json();

        if (!Array.isArray(list) || !list.length) {
          console.warn("Manifest vuoto o non valido");
          return;
        }

        // URL STABILI = cache browser funzionante
        const newImages = list.map(filename => IMG_BASE + encodeURIComponent(filename));

        // Deduplica eventuali doppioni
        const uniqueImages = [...new Set(newImages)];

        const changed = !arraysEqual(uniqueImages, IMAGES);

        if (changed) {
          IMAGES = uniqueImages;
          index = index % IMAGES.length;

          console.log("Manifest aggiornato. Immagini:", IMAGES.length);

          // Pulisci dalla cache solo le immagini non più presenti
          for (const key of imageCache.keys()) {
            if (!IMAGES.includes(key)) {
              imageCache.delete(key);
            }
          }

          // preload prima immagine utile
          preloadNextImage();
        } else {
          console.log("Manifest invariato, nessun download inutile.");
        }
      } catch (e) {
        console.warn("Errore caricamento manifest:", e);
      }
    }

    async function startSlideshow() {
      await refreshImageList();

      if (IMAGES.length) {
        await showNext();
      }

      clearInterval(slideTimer);
      slideTimer = setInterval(() => {
        showNext().catch(err => console.warn("Errore slideshow:", err));
      }, SLIDE_SECONDS * 1000);

      clearInterval(refreshTimer);
      refreshTimer = setInterval(() => {
        refreshImageList().catch(err => console.warn("Errore refresh:", err));
      }, REFRESH_MINUTES * 60 * 1000);
    }

    // =============================
    // ANTISTANDBY
    // =============================
    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator) {
          wakeLock = await navigator.wakeLock.request("screen");
          console.log("🔒 Wake Lock attivo");
          wakeLock.addEventListener?.("release", () => {
            console.log("🔓 Wake Lock rilasciato");
          });
        } else {
          console.log("Wake Lock non supportato");
        }
      } catch (e) {
        console.warn("Wake Lock errore:", e);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        requestWakeLock();
      }
    });

    window.addEventListener("focus", requestWakeLock);

    async function goFullscreen() {
      try {
        const el = document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) {
          await el.requestFullscreen();
        }
      } catch (e) {}
    }

    setInterval(goFullscreen, FULLSCREEN_PING_SEC * 1000);
    goFullscreen();

    // Video keepalive locale
    const keepAlive = document.createElement("video");
    keepAlive.src = "keepalive.mp4";
    keepAlive.autoplay = true;
    keepAlive.loop = true;
    keepAlive.muted = true;
    keepAlive.playsInline = true;
    keepAlive.setAttribute("playsinline", "");
    keepAlive.style = "position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;top:-10px;";
    document.body.appendChild(keepAlive);

    setInterval(() => {
      try {
        keepAlive.currentTime = 0;
        keepAlive.play().catch(() => {});
      } catch (e) {}
    }, KEEPALIVE_VIDEO_SEC * 1000);

    function nudgeAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        gain.gain.value = 0.0001;
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();

        setTimeout(() => {
          try { osc.stop(); } catch (e) {}
        }, 200);
      } catch (e) {
        console.log("AudioContext non disponibile", e);
      }
    }

    setInterval(nudgeAudio, AUDIO_PING_SEC * 1000);

    // Ping rete SENZA colpire Cloud Storage
    function netPing() {
      const url = `${location.origin}${location.pathname}?ping=${Date.now()}`;
      fetch(url, {
        cache: "no-store",
        mode: "no-cors"
      }).catch(() => {});
    }

    setInterval(netPing, NET_PING_SEC * 1000);

    (function rafJiggle() {
      const t0 = performance.now();

      function spin(now) {
        stage.style.transform = "rotate(90deg) translateY(-100%) translateZ(0)";
        if (now - t0 < RAF_JIGGLE_MS) {
          requestAnimationFrame(spin);
        } else {
          setTimeout(rafJiggle, 30000);
        }
      }

      requestAnimationFrame(spin);
    })();

    setInterval(() => {
      window.dispatchEvent(new Event("mousemove"));
      window.dispatchEvent(new Event("keydown"));
      if (document.body.click) {
        try { document.body.click(); } catch (e) {}
      }
    }, 30000);

    window.addEventListener("pageshow", () => {
      requestWakeLock();
      goFullscreen();
      keepAlive.play().catch(() => {});
      nudgeAudio();
      netPing();

      if (!slideTimer) {
        slideTimer = setInterval(() => {
          showNext().catch(err => console.warn("Errore slideshow:", err));
        }, SLIDE_SECONDS * 1000);
      }

      if (!refreshTimer) {
        refreshTimer = setInterval(() => {
          refreshImageList().catch(err => console.warn("Errore refresh:", err));
        }, REFRESH_MINUTES * 60 * 1000);
      }
    });

    // =============================
    // BOOT
    // =============================
    (async function boot() {
      await startSlideshow();
      await requestWakeLock();
      goFullscreen();
      nudgeAudio();
      netPing();
      keepAlive.play().catch(() => {});
    })();
  </script>
</body>
</html>
