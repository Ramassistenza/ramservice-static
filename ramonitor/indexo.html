<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RAMONITOR - Orizzontale</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #slide {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      background-position: center center;
      background-repeat: no-repeat;
      background-size: contain;
    }

    #status {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 9999;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 4px 8px;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="slide"></div>
  <div id="status"></div>

  <script>
    var MANIFEST_URL = "https://ramonitor-api-721276708443.europe-west1.run.app/manifest-horizontal.json";
    var IMG_BASE = "https://storage.googleapis.com/ramonitor-images/img/horizontal/";
    var SLIDE_SECONDS = 7;
    var REFRESH_SECONDS = 30;          // controllo manifest più frequente
    var FORCE_RELOAD_MINUTES = 10;     // reload di sicurezza
    var DEBUG = false;

    var slideEl = document.getElementById("slide");
    var statusEl = document.getElementById("status");

    var images = [];
    var index = 0;
    var lastManifestSignature = "";

    function setStatus(msg) {
      if (!DEBUG) return;
      statusEl.style.display = "block";
      statusEl.innerHTML = msg;
    }

    function buildImageUrl(filename) {
      return IMG_BASE + encodeURIComponent(filename);
    }

    function showImage(url) {
      slideEl.style.backgroundImage = 'url("' + url + '")';
    }

    function clearImage() {
      slideEl.style.backgroundImage = "none";
    }

    function showNext() {
      var url;

      if (!images || !images.length) {
        clearImage();
        setStatus("Nessuna immagine");
        return;
      }

      if (index >= images.length) {
        index = 0;
      }

      url = buildImageUrl(images[index]);
      showImage(url);
      setStatus("Slide " + (index + 1) + "/" + images.length);

      index++;
      if (index >= images.length) {
        index = 0;
      }
    }

    function parseManifest(text) {
      var data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        setStatus("Manifest non valido");
        return null;
      }

      if (!data || typeof data.length === "undefined") {
        setStatus("Manifest non valido");
        return null;
      }

      return data;
    }

    function manifestSignature(list) {
      return list.join("|");
    }

    function forceReload() {
      var base = location.href.split("?")[0];
      location.replace(base + "?reload=" + new Date().getTime());
    }

    function loadManifest() {
      var xhr = new XMLHttpRequest();
      var url = MANIFEST_URL + "?t=" + new Date().getTime();

      xhr.open("GET", url, true);
      xhr.setRequestHeader("Cache-Control", "no-cache, no-store, must-revalidate");
      xhr.setRequestHeader("Pragma", "no-cache");
      xhr.setRequestHeader("Expires", "0");

      xhr.onreadystatechange = function () {
        var newImages;
        var newSignature;
        var changed;

        if (xhr.readyState !== 4) return;

        if (xhr.status !== 200) {
          setStatus("Errore manifest: HTTP " + xhr.status);
          return;
        }

        newImages = parseManifest(xhr.responseText);
        if (newImages === null) {
          return;
        }

        newSignature = manifestSignature(newImages);
        changed = (newSignature !== lastManifestSignature);

        if (changed) {
          lastManifestSignature = newSignature;
          images = newImages;
          index = 0;

          if (!images.length) {
            clearImage();
            setStatus("Manifest vuoto");
            return;
          }

          showNext();

          // Su browser vecchi/Opera Mini è più affidabile ricaricare del tutto
          setTimeout(function () {
            forceReload();
          }, 1000);

          return;
        }

        images = newImages;

        if (index >= images.length) {
          index = 0;
        }

        setStatus("Manifest OK: " + images.length + " immagini");
      };

      xhr.onerror = function () {
        setStatus("Errore rete manifest");
      };

      xhr.send(null);
    }

    function boot() {
      loadManifest();
      setInterval(showNext, SLIDE_SECONDS * 1000);
      setInterval(loadManifest, REFRESH_SECONDS * 1000);
      setInterval(forceReload, FORCE_RELOAD_MINUTES * 60 * 1000);
    }

    boot();
  </script>
</body>
</html>
