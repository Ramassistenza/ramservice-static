<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAMONITOR — Orizzontale</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #slide {
      position: fixed;
      inset: 0;
      background: #000 center center / contain no-repeat;
    }
  </style>
</head>
<body>
  <div id="slide"></div>

  <script>
    var MANIFEST_URL = "https://ramonitor-api-721276708443.europe-west1.run.app/manifest-horizontal.json";
    var IMG_BASE = "https://storage.googleapis.com/ramonitor-images/img/horizontal/";
    var SLIDE_SECONDS = 7;

    var slide = document.getElementById("slide");
    var images = [];
    var index = 0;

    function loadManifest() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", MANIFEST_URL + "?t=" + Date.now(), true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var list = JSON.parse(xhr.responseText);
            if (list && list.length) {
              images = list;
              if (index >= images.length) index = 0;
              showNext();
            }
          } catch (e) {}
        }
      };
      xhr.send();
    }

    function showNext() {
      if (!images.length) return;
      var url = IMG_BASE + encodeURIComponent(images[index]);
      slide.style.backgroundImage = 'url("' + url + '")';
      index = (index + 1) % images.length;
    }

    loadManifest();
    setInterval(showNext, SLIDE_SECONDS * 1000);
    setInterval(loadManifest, 5 * 60 * 1000);
  </script>
</body>
</html>
