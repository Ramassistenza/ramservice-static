<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RAMONITOR - Orizzontale</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #slide {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      text-align: center;
    }

    #slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

  </style>
</head>
<body>
  <div id="slide"></div>
  <script src="player-cache.js"></script>
  <script>
    var slide = document.getElementById("slide");
    startRAMonitor({
      orientation: "horizontal",
      manifest: "https://ramonitor-api-721276708443.europe-west1.run.app/manifest-horizontal.json",
      refreshMs: 20000,
      clear: function () { slide.textContent = ""; },
      render: function (image) {
        slide.textContent = "";
        slide.appendChild(image);
      }
    });
  </script>
</body>
</html>
