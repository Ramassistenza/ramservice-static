<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAMONITOR — Slideshow Horizontal</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }

    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    .layer {
      position: absolute;
      inset: 0;
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity .5s linear;
      will-change: opacity;
    }

    .layer.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="layer" id="A"></div>
    <div class="layer" id="B"></div>
  </div>

  <script>
    const MANIFEST_URL = "https://ramonitor-api-721276708443.europe-west1.run.app/manifest-horizontal.json";
    const IMG_BASE = "https://storage.googleapis.com/ramonitor-images/img/horizontal/";
    const SLIDE_SECONDS = 7;
    const REFRESH_MINUTES = 5;

    const imageCache = new Map();
    let IMAGES = [];
    let index = 0;
    let showingA = true;

    const A = document.getElementById("A");
    const B = document.getElementById("B");

    function arraysEqual(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return false;
      }
      return true;
    }

    function preloadImage(url) {
      return new Promise((resolve) => {
        if (imageCache.has(url)) {
          const cached = imageCache.get(url);
          if (cached.complete) return resolve(cached);
        }

        const img = new Image();
        img.onload = () => {
          imageCache.set(url, img);
          resolve(img);
        };
        img.onerror = () => resolve(null);
        img.src = url;
        imageCache.set(url, img);
      });
    }

    async function refreshImageList() {
      try {
        const res = await fetch(`${MANIFEST_URL}?t=${Date.now()}`, { cache: "no-store" });
        const list = await res.json();

        if (!Array.isArray(list) || !list.length) return;

        const newImages = [...new Set(list.map(filename => IMG_BASE + encodeURIComponent(filename)))];

        if (!arraysEqual(newImages, IMAGES)) {
          IMAGES = newImages;
          index = index % IMAGES.length;
        }
      } catch (e) {
        console.warn("Errore caricamento manifest:", e);
      }
    }

    async function showNext() {
      if (!IMAGES.length) return;

      const next = IMAGES[index % IMAGES.length];
      const front = showingA ? A : B;
      const back = showingA ? B : A;

      const preloaded = await preloadImage(next);
      if (!preloaded) return;

      back.style.backgroundImage = `url("${next}")`;
      back.classList.add("show");
      front.classList.remove("show");

      showingA = !showingA;
      index++;
    }

    async function boot() {
      await refreshImageList();
      if (IMAGES.length) await showNext();

      setInterval(showNext, SLIDE_SECONDS * 1000);
      setInterval(refreshImageList, REFRESH_MINUTES * 60 * 1000);
    }

    boot();
  </script>
</body>
</html>
